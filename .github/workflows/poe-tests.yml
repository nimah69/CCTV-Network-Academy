name: PoE module tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/poe-reference-model]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run PoE reference tests
        run: node --test tests/poe.test.mjs
      - name: Run repository test suite
        run: npm test
