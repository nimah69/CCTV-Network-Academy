name: PoE module tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/poe-reference-model]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run PoE reference tests
        run: node --test tests/poe.test.mjs
