name: Build offline Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'workshops.html'
      - 'css/**'
      - 'js/**'
      - 'manifest.webmanifest'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare offline web assets
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="android/app/src/main/assets/academy"
          mkdir -p "$ASSETS"
          cp index.html "$ASSETS/"
          cp workshops.html "$ASSETS/"
          cp -R css js "$ASSETS/"
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest "$ASSETS/"; fi
          # Verify local references used by the app are present.
          test -s "$ASSETS/index.html"
          test -s "$ASSETS/workshops.html"
          test -s "$ASSETS/js/academy-data.js"
          test -s "$ASSETS/css/academy.css"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cctv-network-academy-offline-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
