name: Validate academy content and JavaScript

on:
  push:
    branches: [main, improve-learning-quality, improve-quiz-quality, interactive-workshops-suite, audit-and-improve-2026, workshops-visual-lab-2026, phase1-stability, visual-schematic-lab-2026]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript and question bank
        run: |
          node tests/quality-check.mjs
          node tests/workshops-check.mjs
          node tests/calculations-check.mjs
          node tests/chapter-labs-check.mjs
          node tests/offline-readiness-check.mjs\n          node tests/schematics-check.mjs
