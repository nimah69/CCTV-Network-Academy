name: Validate academy content and JavaScript

on:
  push:
    branches: [main, improve-learning-quality, improve-quiz-quality, interactive-workshops-suite, audit-and-improve-2026, workshops-visual-lab-2026, phase1-stability, roadmap-implementation-2026, improve/mobile-accessibility-stage2, test/calculations-cache-stage4, feat/review-learning-tools-stage3-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run all required quality checks
        run: |
          set -e
          for f in tests/*.mjs; do
            echo "== Running $f"
            node "$f"
          done
