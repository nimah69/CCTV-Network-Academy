name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "index.html"
      - "workshops.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "icons/**"
      - "js/**"
      - "css/**"
      - "fonts/**"
      - "scripts/**"
      - "tests/**"
      - "android/**"
      - ".github/workflows/offline-apk-ci.yml"
      - ".github/workflows/pages.yml"
      - "README.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  build-offline-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run all academy quality checks
        run: |
          set -e
          for f in tests/*.mjs; do
            echo "== Running $f"
            node "$f"
          done

      - name: Bundle local website files
        run: bash scripts/bundle-android-assets.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle Wrapper
        run: |
          set -e
          gradle -p android wrapper --gradle-version 8.7
          chmod +x android/gradlew

      - name: Upload generated Gradle Wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Wrapper-Bootstrap
          path: |
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/gradle-wrapper.jar
            android/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 7

      - name: Build offline APK using Gradle Wrapper
        run: ./android/gradlew -p android --no-daemon clean assembleDebug

      - name: Verify APK package and signature
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload offline APK
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-Network-Academy-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
