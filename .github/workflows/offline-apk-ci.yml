name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "index.html"
      - "workshops.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "icons/**"
      - "js/**"
      - "tests/**"
      - "android/**"
      - ".github/workflows/offline-apk-ci.yml"

permissions:
  contents: read

jobs:
  build-offline-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run all academy quality checks
        run: |
          set -e
          for f in tests/*.mjs; do
            echo "== Running $f"
            node "$f"
          done

      - name: Bundle local website files
        run: |
          set -e
          mkdir -p android/app/src/main/assets/academy/js android/app/src/main/assets/academy/icons
          cp index.html workshops.html manifest.webmanifest service-worker.js android/app/src/main/assets/academy/
          cp icons/*.svg android/app/src/main/assets/academy/icons/
          cp js/*.js android/app/src/main/assets/academy/js/
          test -s android/app/src/main/assets/academy/index.html
          test -s android/app/src/main/assets/academy/workshops.html
          test -s android/app/src/main/assets/academy/manifest.webmanifest
          test -s android/app/src/main/assets/academy/service-worker.js
          test -s android/app/src/main/assets/academy/icons/academy-icon.svg
          for f in js/*.js; do
            test -s "android/app/src/main/assets/academy/$f"
          done
          test -s android/app/src/main/assets/academy/js/academy-data.js
          test -s android/app/src/main/assets/academy/js/calculations.js
          test -s android/app/src/main/assets/academy/js/chapter-labs.js
          test -s android/app/src/main/assets/academy/js/chapter-lab-ui.js
          test -s android/app/src/main/assets/academy/js/spaced-review.js
          echo "Bundled files:"
          find android/app/src/main/assets/academy -type f | sort

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build offline APK
        run: gradle -p android --no-daemon clean assembleDebug

      - name: Verify APK package and signature
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload offline APK
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-Network-Academy-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
