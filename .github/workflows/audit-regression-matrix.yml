name: Audit regression matrix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression / ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - android-offline-check.mjs
          - offline-readiness-check.mjs
          - pwa-readiness-check.mjs
          - simulator-calculators.test.mjs
          - simulator-syntax.test.mjs
          - workshops-check.mjs
          - workshops-interaction-check.mjs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run targeted regression test
        run: node "tests/${{ matrix.test }}"
