plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nimah.cctvacademy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nimah.cctvacademy'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1-offline"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
