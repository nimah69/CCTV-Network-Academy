/* Cyber Academy theme — visual-only overrides */
:root{
 --bg:#080f1c;--panel:#101b2d;--ink:#e7effb;--muted:#9aabc3;--line:#293a52;
 --nav:#070e1a;--nav2:#14243b;--brand:#398bff;--brand2:#40d9e7;--teal:#28d9c0;
 --soft:#172e49;--good:#39d6a0;--bad:#ff8292;--shadow:0 14px 36px #00000024;
 color-scheme:dark
}
body{background:var(--bg);color:var(--ink)}
button,input{color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--brand2);outline-offset:3px}
.top{background:#0b1424ed;border-color:var(--line)}
.hamb{background:#122139;color:var(--ink);border-color:#344b68;min-width:44px;min-height:44px;justify-content:center}
.search input{background:#101d30;border-color:#30435e;color:var(--ink);min-height:44px}
.search input::placeholder{color:#879bb7}
.welcome{background:radial-gradient(ellipse at 8% 15%,#164a67 0,transparent 42%),linear-gradient(115deg,#0d192c,#142d50 70%,#153e5a)}
.welcome:after{border-color:#52d7e72b;box-shadow:0 0 0 35px #40d9e70b,0 0 0 70px #40d9e706}
.welcome .primary{background:#e8fbff;color:#09223a}
.stat,.panel,.course,.secondary,.quiz-question{background:var(--panel);border-color:var(--line);color:var(--ink)}
.stat-icon,.course-icon{background:#17304d;color:#6ed7ff}
.course:hover{border-color:#40d9e7;box-shadow:0 12px 30px #0003}
.course p,.course-foot,.stat small,.section-head p,.lesson-intro,.crumb{color:var(--muted)}
.progress{background:#25354b}
.pill{background:#153d4b;color:#7ce8e4}
.lesson-content{color:#dce7f7}
.lesson-content h3{color:#f0f6ff}
.callout{background:#102f34;border-right-color:var(--teal);color:#d6f7f1}
.supplement{border-top-color:var(--line)}
.supplement-item{background:#0d1727;border-color:#2b3e58}
.supplement-item summary{color:#e6f0ff}
.supplement-item p{color:#b6c5da}
.secondary{border-color:#344761;background:#142238}
.secondary:hover{border-color:var(--brand2);background:#1a3049}
.primary{background:linear-gradient(110deg,#2879e8,#19a9c4);color:#fff;min-height:44px}
.option{border-color:#2c405a;background:#0c1728;color:#dce8f8;min-height:44px}
.option:hover{border-color:#4389c7;background:#12243a}
.option:has(input:checked){border-color:var(--brand2);background:#123244}
.option input{accent-color:var(--brand2)}
.feedback.good{background:#10352f;color:#8af0c5}
.feedback.bad{background:#3a202b;color:#ffabb5}
.result{background:#12253a;border:1px solid #294c69;color:#e5f3ff}
.empty{color:var(--muted)}
.footer{color:#8498b5}
.side-note{background:#0c1727;border-color:#293a52}
.nav button{min-height:44px}
.sidebar-close{display:none}
.sidebar-backdrop{display:none}
@media(max-width:850px){
 .side{background:#080f1c;border-left:1px solid #2b3e58;padding-top:64px}
 .side.open{box-shadow:-18px 0 50px #0008}
 .sidebar-close{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:7px;min-height:42px;padding:7px 12px;border:1px solid #344761;border-radius:10px;background:#142238;color:#e7effb;font-size:13px}
 .sidebar-close:first-letter{font-size:20px}
 .sidebar-backdrop.open{display:block;position:fixed;inset:0;z-index:19;background:#020712a8;backdrop-filter:blur(2px)}
 .wrap{padding-bottom:30px}
 .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:520px){
 .stats{grid-template-columns:1fr}
 .welcome{border-radius:17px}
 .panel{border-radius:15px}
 .quiz-question{padding:13px}
 .lesson-actions{gap:8px}
 .lesson-actions button{flex:1 1 140px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}


.practice-task{margin-top:14px;padding:13px;border:1px solid #31516a;border-radius:10px;background:#101f31}
.practice-task>p{margin:0 0 10px}
.practice-label{display:block;font-size:12px;font-weight:bold;color:#b9e9f2;margin:8px 0}
.practice-input{display:block;width:100%;resize:vertical;min-height:82px;border:1px solid #38536d;border-radius:9px;padding:10px;background:#091625;color:#e7effb;font:inherit;font-size:13px;line-height:1.8}

.practice-guide{margin-top:10px;border-top:1px solid #2b4058;padding-top:9px}
.practice-guide summary{cursor:pointer;color:#7ce8e4;font-size:12px;font-weight:bold;padding:5px 0}
.practice-guide p{margin:8px 0}
/* Text-only wiring and equipment schematics */
.diagram-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.diagram-card{min-width:0;border:1px solid #2b4058;border-radius:12px;background:#0b1727;padding:13px}

.calculator-section{margin-top:30px}

.calculator-card>p{font-size:12px;color:#aebfd5;margin:0 0 13px}
.calc-fields{display:grid;gap:9px;margin:12px 0}

.calc-result{margin-top:12px;min-height:88px;border-radius:9px;background:#10283a;border:1px solid #2a4b63;padding:11px;font-size:12px;line-height:2;color:#cfe9f4}

/* Per-question teach-back explanation */
.answer-explanation{margin-top:12px;border:1px solid #2b5871;border-radius:12px;background:#0c1b2b;overflow:hidden}
.answer-explanation summary{cursor:pointer;list-style:none;padding:12px 14px;min-height:46px;display:flex;align-items:center;gap:9px;color:#79e6e9;font-size:12px;font-weight:bold}
.answer-explanation summary::-webkit-details-marker{display:none}
.answer-explanation summary:before{content:"＋";display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:#16384b;color:#7ce8e4;font-size:16px;flex-shrink:0}
.answer-explanation[open] summary:before{content:"−"}
.explanation-body{padding:0 14px 14px;color:#d5e4f5;font-size:13px;line-height:1.95}

/* Modern scenario-based workshop system */
.chapter-lab{margin:26px 0;padding:clamp(14px,2.6vw,24px);border:1px solid #244c67;border-radius:22px;background:radial-gradient(ellipse at 92% 0%,#153954 0,transparent 42%),linear-gradient(145deg,#081523,#0b1c2d 68%,#0d2638);color:#e8f2ff;box-shadow:0 20px 45px #06101e24;overflow:hidden}

{title:"امنیت سایبری دوربین‌های IP",pages:"۳۳–۳۵",icon:"⌑",desc:"حساب‌ها، به‌روزرسانی، جداسازی شبکه و دسترسی راه دور",intro:"سامانه CCTV خود یک دارایی شبکه‌ای است و باید با کنترل‌های چندلایه محافظت شود.",sections:[

["شبکه امن","دوربین‌ها را در صورت نیاز از شبکه‌های دیگر جدا کنید و ارتباطات را با Firewall و ACL کنترل کنید. VLAN به‌تنهایی امنیت کامل ایجاد نمی‌کند."],
["Firmware و سرویس‌ها","Firmware را طبق فرایند امن و سازگار با سازنده به‌روز نگه دارید؛ سرویس‌ها و پورت‌های غیرضروری را غیرفعال کنید و تنظیمات امن را مستند سازید."],
["دسترسی از راه دور","از قراردادن مستقیم رابط مدیریتی دوربین یا NVR روی اینترنت اجتناب کنید. دسترسی راه دور باید کنترل‌شده باشد؛ در جزوه VPN در مقایسه با Port Forwarding به‌عنوان گزینه امن‌تر مطرح شده است."],
["پایش و ثبت","Log، Monitoring، NTP و بازبینی دسترسی‌ها برای تحلیل حادثه و پاسخ‌گویی اهمیت دارند. در رخداد امنیتی، دسترسی را طبق رویه سازمان کنترل و شواهد را مستند کنید."]],tips:"رمز قوی ضروری است اما کافی نیست؛ Firmware، سرویس‌های باز، دسترسی فیزیکی، شبکه و پایش هم باید بررسی شوند.",quiz:[
{q:"چرا دوربین را معمولاً نباید مستقیماً به اینترنت وصل کرد؟",o:["چون کیفیت تصویر را زیاد می‌کند","چون سطح حمله و مواجهه سرویس مدیریتی را افزایش می‌دهد","چون IP نمی‌گیرد","چون NTP را غیرفعال می‌کند"],a:1,e:"در معرض اینترنت قرارگرفتن سرویس مدیریتی، سطح حمله را افزایش می‌دهد."},
{q:"حداقل سطح دسترسی (Least Privilege) یعنی چه؟",o:["همه کاربران مدیر باشند","هر کاربر فقط دسترسی لازم برای وظیفه‌اش را داشته باشد","رمزها حذف شوند","Log غیرفعال شود"],a:1,e:"اصل حداقل دسترسی، مجوزهای غیرضروری را کاهش می‌دهد."}]},
{title:"پشتیبان‌گیری و بازیابی بحران",pages:"۳۵–۳۶",icon:"↻",desc:"Backup، Disaster Recovery، RPO و RTO",intro:"جزوه این بخش را با عنوان «Backup و Disaster Recovery» معرفی می‌کند.",sections:[
["Backup","نسخه‌ای از اطلاعات یا تنظیمات برای بازیابی در صورت خرابی، حذف اشتباه، حمله یا حادثه است. داشتن Backup به‌تنهایی کافی نیست؛ بازیابی باید آزمایش شود."],
["Disaster Recovery","مجموعه فرآیندها و زیرساخت‌هایی برای بازگرداندن سرویس‌ها پس از حادثه جدی است؛ از جمله خرابی Storage یا Server، حمله سایبری، Ransomware، قطع برق، آتش‌سوزی یا سیل."],
["RPO و RTO","RPO حداکثر میزان قابل قبول از دست رفتن داده از نظر زمانی است؛ RTO هدف زمانی برای بازیابی سرویس است. در مثال جزوه، RPO یک ساعت و RTO دو ساعت بیان شده‌اند."],
["روش نگهداری نسخه","Backup باید منظم باشد، بازیابی آن آزمایش شود، در محل مناسب نگهداری و در برابر دسترسی غیرمجاز محافظت شود. نگهداری Offline یا جدا از سامانه اصلی در صورت نیاز، ریسک رخداد مشترک را کاهش می‌دهد."]],tips:"RPO درباره داده قابل‌از‌دست‌رفتن است؛ RTO درباره زمان هدف بازیابی سرویس. این دو را با هم اشتباه نگیرید.",quiz:[
{q:"RPO به چه چیزی مربوط است؟",o:["مدت زمان بازیابی سرویس","میزان داده قابل از دست رفتن از نظر زمانی","نوع لنز","تعداد کانال‌های NVR"],a:1,e:"RPO حداکثر میزان قابل قبول از دست رفتن داده را مشخص می‌کند."},
{q:"چرا Backup باید آزمایش بازیابی شود؟",o:["برای افزایش رزولوشن","برای اطمینان از قابل Restore بودن نسخه","برای حذف NTP","برای خاموش کردن RAID"],a:1,e:"داشتن نسخه پشتیبان بدون اطمینان از قابلیت بازیابی کافی نیست."}]},
{title:"مدیریت ریسک",pages:"۳۶–۳۷",icon:"◇",desc:"دارایی، تهدید، آسیب‌پذیری و درمان ریسک",intro:"مدیریت ریسک کمک می‌کند کنترل‌ها بر اساس دارایی‌ها، تهدیدها و پیامدهای واقعی انتخاب شوند.",sections:[
["واژگان کلیدی","Asset دارایی ارزشمند است؛ Threat عامل یا رویدادی است که می‌تواند آسیب ایجاد کند؛ Vulnerability ضعف قابل سوءاستفاده است؛ Risk ترکیبی از احتمال رویداد نامطلوب و پیامد آن است."],
["ارزیابی ریسک","Risk Assessment شامل شناسایی دارایی‌ها، تهدیدها، آسیب‌پذیری‌ها و ارزیابی ریسک‌های مربوط به آن‌هاست. مثال جزوه: دوربین ورودی دارایی است؛ خرابکاری تهدید و نصب در ارتفاع پایین آسیب‌پذیری است."],
["درمان ریسک","روش‌های متداول شامل کاهش، اجتناب، انتقال و پذیرش ریسک است. انتخاب روش باید متناسب با پیامد و شرایط سازمان باشد."],
["دفاع چندلایه","Defense in Depth به‌معنای تکیه‌نکردن به یک کنترل واحد است؛ محافظ فیزیکی، جداسازی شبکه، Firewall، احراز هویت، ثبت رویداد، پایش و Backup می‌توانند لایه‌های مکمل باشند."]],tips:"در سناریوهای آزمون، دارایی، تهدید، آسیب‌پذیری، پیامد و کنترل پیشنهادی را جداگانه مشخص کنید.",quiz:[
{q:"نصب دوربین ورودی در ارتفاع پایین که دست‌کاری آن آسان است، نمونه چیست؟",o:["دارایی","آسیب‌پذیری","Backup","RTO"],a:1,e:"ضعفی که امکان سوءاستفاده یا آسیب را افزایش دهد، آسیب‌پذیری است."},
{q:"Defense in Depth به چه معناست؟",o:["استفاده از یک رمز قوی به‌تنهایی","استفاده از چند لایه دفاعی مکمل","حذف Log","اتصال مستقیم به اینترنت"],a:1,e:"هدف این است که شکست یک کنترل باعث شکست کل سامانه نشود."}]},
{title:"استانداردها و چارچوب‌ها",pages:"۳۷–۳۸",icon:"▧",desc:"ISO، TIA-942، Tier و راهنماهای NIST",intro:"جزوه میان استاندارد، الزام قانونی یا قراردادی و راهنمای مرجع تمایز می‌گذارد.",sections:[
["استاندارد و الزام","استاندارد مجموعه الزامات یا قواعد پذیرفته‌شده است. همه استانداردها الزام قانونی نیستند؛ الزام می‌تواند از قانون، قرارداد، سازمان یا انتخاب داوطلبانه ناشی شود."],
["استانداردهای امنیت و تداوم","ISO/IEC 27001 درباره الزامات سیستم مدیریت امنیت اطلاعات است؛ ISO/IEC 27002 راهنمای کنترل‌های امنیت اطلاعات؛ ISO 22301 درباره مدیریت تداوم کسب‌وکار و ISO 31000 درباره مدیریت ریسک است."],
["مراکز داده","TIA-942 به زیرساخت مراکز داده، مانند ساختمان، برق، سرمایش، کابل‌کشی و امنیت فیزیکی می‌پردازد. ISO/IEC 22237 نیز مجموعه‌ای از استانداردها در حوزه امکانات و زیرساخت مراکز داده است."],
["Tier و NIST","در مدل شناخته‌شده Uptime Institute، Tier I تا Tier IV سطوحی برای قابلیت اطمینان و افزونگی زیرساخت مراکز داده‌اند؛ این مفهوم فقط مخصوص CCTV نیست. NIST راهنماها و چارچوب‌های فناوری و امنیت سایبری منتشر می‌کند و خودبه‌خود قانون ایران محسوب نمی‌شود."]],tips:"هنگام پاسخ به پرسش استانداردها، موضوع استاندارد را دقیق بگویید و الزام‌آور بودن را به قانون، قرارداد یا چارچوب مربوط وابسته بدانید.",quiz:[
{q:"ISO/IEC 27001 در جزوه به چه موضوعی مربوط است؟",o:["سیستم مدیریت امنیت اطلاعات","کدک ویدئو","حفاظت در برابر ضربه","فشرده‌سازی تصویر"],a:0,e:"ISO/IEC 27001 الزامات ISMS یا سیستم مدیریت امنیت اطلاعات را مشخص می‌کند."},
{q:"Tier در مدل مراکز داده بیانگر چیست؟",o:["رزولوشن دوربین","سطح قابلیت اطمینان و افزونگی زیرساخت","کد فشرده‌سازی","نوع آدرس IP"],a:1,e:"Tier به طبقه‌بندی قابلیت اطمینان و افزونگی زیرساخت مراکز داده مرتبط است."}]},
{title:"عیب‌یابی حرفه‌ای CCTV",pages:"۳۸–۴۰",icon:"⌕",desc:"عیب‌یابی مرحله‌ای قطع تصویر، تأخیر و مشکلات ضبط",intro:"به‌جای حدس‌زدن یا بررسی تصادفی، از نشانه‌ها برای محدودکردن محل مشکل استفاده کنید.",sections:[
["دوربین کاملاً Offline","به‌ترتیب برق دوربین، PoE، کابل، Link LED، پورت سوئیچ، IP، Ping، ARP، تنظیمات شبکه، Firmware و سپس NVR/VMS را بررسی کنید."],

["Ping هست ولی تصویر نیست","پورت و سرویس، نام کاربری و رمز، ONVIF، Stream، Codec، NVR/VMS، Firewall و پهنای باند را بررسی کنید."],
["تصویر تکه‌تکه یا با تأخیر","Packet Loss، Bandwidth، ازدحام شبکه، CPU، Storage، کابل، تنظیمات Encoding و بار پردازشی را بررسی کنید."],
["مشکلات شب و ضبط","در تصویر خراب شبانه، IR، Smart IR، Exposure، WDR، بازتاب IR، شیشه، تمیزی لنز، برق و دما را بررسی کنید. برای ضبط‌نشدن، Storage، HDD، برنامه ضبط، سیاست ضبط و مجوزها را بررسی کنید."]],tips:"اگر چند دوربین هم‌زمان قطع شوند، ابتدا زیرساخت مشترک مثل برق، PoE Switch، Uplink و شبکه اصلی را بررسی کنید؛ اگر فقط یک دوربین قطع است، مسیر اختصاصی آن محتمل‌تر است.",quiz:[

{title:"سناریوهای آزمون و مصاحبه",pages:"۴۰–۴۱",icon:"▣",desc:"حل مسئله‌های عملی طراحی و نگهداری",intro:"پاسخ حرفه‌ای باید روند بررسی و دلیل انتخاب کنترل را بیان کند، نه فقط نام یک تجهیز را.",sections:[
["چهره یا پلاک واضح نیست","ابتدا هدف دوربین، فاصله، ارتفاع، زاویه لنز، Pixel Density، نور، WDR، Shutter Speed، Motion Blur و Resolution را بررسی کنید؛ افزایش مگاپیکسل راه‌حل قطعی نیست."],
["دسترسی غیرمجاز یا کارکنان سابق","برای اتصال بیرونی به NVR، قرارگرفتن مستقیم روی اینترنت، Firewall، Port Forwarding، VPN، حساب‌ها، رمز، MFA و Log را بررسی کنید. پس از خروج کارمند، حساب‌ها و مجوزهای فیزیکی و شبکه‌ای بازبینی شوند."],

["پاسخ مصاحبه‌ای","یک پاسخ خوب ساختار دارد: نیاز و ریسک را مشخص می‌کند، فرض‌ها را بررسی می‌کند، اقدامات را به ترتیب اولویت می‌چیند و در پایان آزمون، مستندسازی و پایش را فراموش نمی‌کند."]],tips:"در مصاحبه، فقط نام ابزار را ردیف نکنید؛ توضیح دهید چه چیزی را، با چه ترتیبی و برای رد یا تأیید کدام احتمال بررسی می‌کنید.",quiz:[

{title:"مفاهیم سخت و پرسش‌های تحلیلی",pages:"۴۱–۴۲",icon:"∴",desc:"دلیل انتخاب کنترل‌ها و تفاوت مفاهیم نزدیک",intro:"این بخش برای تمرین توضیح چرایی تصمیم‌های طراحی و امنیتی است.",sections:[

const supplemental = [
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["مدل TCP/IP به زبان ساده","در عیب‌یابی، ارتباط را مرحله‌ای ببینید: رسانه و لینک، شبکه محلی و IP، مسیریابی و در نهایت سرویس کاربردی. برای مثال روشن بودن چراغ پورت فقط نشانه‌ای از لینک فیزیکی است و به‌تنهایی سلامت جریان ویدئو را ثابت نمی‌کند."],["Subnet Mask و Gateway","Subnet Mask تعیین می‌کند مقصد در همان شبکه محلی است یا خیر. Gateway معمولاً مسیر خروج به شبکه‌های دیگر است. IP تکراری، ماسک نادرست یا Gateway اشتباه می‌تواند باعث دسترسی ناپایدار شود."],["UDP و TCP","برخی جریان‌های رسانه‌ای از UDP برای تأخیر کم استفاده می‌کنند؛ TCP تحویل مرتب‌تر و قابل‌اعتمادتر داده را فراهم می‌کند، اما ممکن است در شبکه شلوغ تأخیر ایجاد شود. انتخاب دقیق به پروتکل و پیاده‌سازی دستگاه وابسته است."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["انتخاب لنز بر اساس هدف","زاویه دید باز، محدوده بیشتری را می‌پوشاند اما سوژه دورتر پیکسل کمتری خواهد داشت. لنز با فاصله کانونی بیشتر میدان دید باریک‌تری دارد و می‌تواند جزئیات سوژه دورتر را بهتر نشان دهد؛ انتخاب نهایی باید با نقشه و آزمایش میدانی انجام شود."],["نوردهی و حرکت","در نور کم، افزایش زمان نوردهی ممکن است تصویر را روشن‌تر کند ولی سوژه متحرک را محو می‌کند. افزایش Gain هم می‌تواند نویز را بیشتر کند. تنظیمات باید با سرعت حرکت سوژه و هدف مدرک تصویری متعادل شود."],["پهنای باند و فشرده‌سازی","Bitrate به صحنه، تعداد دوربین‌ها، وضوح، FPS، کدک و تنظیمات وابسته است. عددهای محاسباتی تخمین‌اند؛ برای طراحی نهایی، نرخ واقعی جریان و حاشیه ظرفیت شبکه را اندازه‌گیری کنید."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["DVR، NVR و XVR","DVR معمولاً برای ورودی‌های دوربین آنالوگ استفاده می‌شود؛ NVR برای جریان دوربین‌های IP طراحی شده است؛ XVR در بسیاری از محصولات از چند نوع سیگنال دوربین پشتیبانی می‌کند. سازگاری دقیق را از مشخصات همان مدل بررسی کنید."],["PoE و توان","PoE می‌تواند برق و داده را روی کابل اترنت منتقل کند. استاندارد، توان قابل ارائه پورت و بودجه توان کل سوئیچ را بررسی کنید؛ مجموع مصرف دوربین‌ها، به‌ویژه هنگام فعال شدن IR یا گرم‌کن، نباید از بودجه مجاز فراتر رود."],["ONVIF و سازگاری","وجود نشان ONVIF به معنی تضمین تمام قابلیت‌ها نیست. Profile، نسخه، قابلیت‌های پیاده‌سازی‌شده و سازگاری واقعی میان دوربین و NVR را پیش از خرید آزمایش کنید."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["بودجه ذخیره‌سازی","برآورد اولیه حجم ویدئو از جمع Bitrate دوربین‌ها، زمان ضبط و ضریب تبدیل بیت به بایت به دست می‌آید؛ سربار، تغییر نرخ بیت، RAID و فضای قابل استفاده باید جداگانه لحاظ شوند. ظرفیت تبلیغ‌شده هارد با ظرفیت قابل استفاده یکسان نیست."],["HDD نظارتی","در انتخاب هارد به کاربری نظارتی، بار نوشتن، تعداد جریان‌ها، سازگاری NVR و توصیه سازنده توجه کنید. سلامت دیسک و هشدارهای SMART را پایش کنید؛ RAID هم جای Backup را نمی‌گیرد."],["Retention و سیاست نگهداری","مدت نگهداری باید بر اساس نیاز عملیاتی، مقررات و سیاست سازمان تعیین شود. ضبط دائمی، تشخیص حرکت و نرخ فریم متغیر هرکدام بر ظرفیت و احتمال از دست رفتن لحظه‌های مهم اثر دارند."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["کابل مسی و محدودیت مسیر","در اترنت مسی، طول کانال استاندارد معمولاً تا ۱۰۰ متر است (با توجه به نوع کابل و اجزای مسیر). مسیر طولانی‌تر ممکن است به فیبر، سوئیچ میانی یا طراحی دیگری نیاز داشته باشد؛ صرفاً تعویض سوکت محدودیت طول را برطرف نمی‌کند."],["Cat5e، Cat6 و نصب","رده کابل به‌تنهایی کیفیت نصب را تضمین نمی‌کند. خم شدید، کشش، له‌شدگی، نزدیکی به منابع تداخل و سربندی بد می‌توانند عملکرد را کاهش دهند. تستر مناسب و مستندسازی مسیر برای تحویل حرفه‌ای مهم‌اند."],["فیبر نوری","فیبر برای مسیرهای طولانی‌تر و جداسازی الکتریکی مفید است، اما به ماژول‌های سازگار، نوع فیبر مناسب، تمیزی کانکتور و رعایت شعاع خمش نیاز دارد. فیبر معمولاً برق PoE را منتقل نمی‌کند."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["مسیر جریان تصویر","در یک سامانه معمول، دوربین جریان را به شبکه می‌فرستد؛ سوئیچ آن را منتقل می‌کند و NVR/VMS دریافت و ضبط می‌کند. دسترسی از راه دور باید از مسیر امن و کنترل‌شده عبور کند؛ بازکردن مستقیم پورت دستگاه به اینترنت معمولاً انتخاب پرریسکی است."],["VPN و دسترسی راه دور","VPN تونلی رمزنگاری‌شده برای دسترسی به شبکه سازمانی فراهم می‌کند، اما به‌تنهایی امنیت کامل نیست. احراز هویت قوی، به‌روزرسانی، محدودسازی دسترسی و ثبت رویداد همچنان لازم‌اند."],["RTSP و HTTPS","RTSP در بسیاری از دوربین‌ها برای کنترل/دریافت جریان رسانه‌ای استفاده می‌شود و HTTPS برای ارتباط وب رمزنگاری‌شده است. پشتیبانی و پورت‌های واقعی باید در مستندات دستگاه بررسی شوند؛ از قراردادن گذرواژه در لینک‌های قابل انتشار پرهیز کنید."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["چک‌لیست نصب فیزیکی","قبل از سوراخ‌کاری، میدان دید و نقاط کور را روی نقشه بررسی کنید؛ سازه نصب، آب‌بندی، مسیر کابل، دسترسی سرویس، احتمال خرابکاری و قوانین حریم خصوصی را بسنجید."],["پذیرش پس از نصب","برای هر دوربین تصویر روز و شب، Focus، زمان، ضبط و بازپخش، قطع و وصل شبکه، دید در شرایط نور دشوار و هشدارهای دستکاری را ثبت کنید. تست را در شرایط واقعی محل انجام دهید."],["مستندسازی","به هر دوربین شناسه ثابت بدهید و آن را به محل، IP، سوئیچ/پورت، مدل، Firmware و کانال NVR مرتبط کنید. این جدول زمان عیب‌یابی و تغییرات آتی را کاهش می‌دهد."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["حداقل‌سازی سطح حمله","قابلیت‌های غیرضروری و حساب‌های پیش‌فرض را حذف یا غیرفعال کنید، Firmware را از منبع رسمی به‌روز نگه دارید و دسترسی مدیریتی را فقط به شبکه و افراد لازم محدود کنید."],["تفکیک شبکه","دوربین‌ها را در شبکه یا VLAN مجزا قرار دهید و قواعد Firewall/ACL را به حداقل ارتباط موردنیاز محدود کنید. جداسازی منطقی باید با کنترل مسیرهای بین شبکه‌ای همراه باشد."],["ثبت رویداد و زمان","لاگ ورود، تغییر تنظیمات، خطا و دسترسی راه دور را در حد پشتیبانی دستگاه فعال کنید و ساعت تجهیزات را با منبع زمان معتبر هماهنگ کنید. از لاگ‌ها و تنظیمات حساس با دسترسی کنترل‌شده نگهداری کنید."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["احتمال و پیامد","در ماتریس ریسک، احتمال وقوع و شدت پیامد را جدا ارزیابی کنید. امتیازهای عددی فقط ابزار اولویت‌بندی‌اند و باید با روش مصوب سازمان تفسیر شوند."],["ثبت مالک ریسک","برای هر ریسک مهم، مالک، کنترل موجود، اقدام اصلاحی، مسئول و موعد بازبینی مشخص کنید. پذیرش ریسک باید آگاهانه و طبق اختیار سازمان باشد."],["بازنگری ریسک","پس از تغییر شبکه، اضافه شدن دوربین، تغییر محل، حادثه یا آسیب‌پذیری تازه، ارزیابی ریسک را بازبینی کنید؛ ریسک ثابت و همیشگی فرض نمی‌شود."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["روش استانداردها","شماره نسخه و دامنه استاندارد را بررسی کنید؛ عنوان مشابه یا نام یک استاندارد به‌تنهایی ثابت نمی‌کند که کنترل مشخصی اجرا شده است. برای پروژه واقعی، نسخه معتبر و الزامات قراردادی/قانونی محل اجرا ملاک‌اند."],["کنترل انطباق","یک جدول تطبیق تهیه کنید: الزام، شاهد مورد انتظار، وضعیت فعلی، شکاف و اقدام اصلاحی. مستندات، تنظیمات واقعی و آزمون عملی باید با هم سازگار باشند."],["تفاوت راهنما و الزام","راهنمای فنی می‌تواند روش مناسب پیشنهاد دهد اما الزام‌آور بودن آن وابسته به قرارداد، مقررات یا سیاست سازمان است. درباره دامنه حقوقی بدون بررسی منبع معتبر ادعای قطعی نکنید."]]},

function shortenOption(text){
  const clean=String(text||"").replace(/\\s+/g," ").trim();
  if(clean.length<=145)return clean;
  const cut=clean.slice(0,142);
  const boundary=cut.lastIndexOf(" ");
  return (boundary>95?cut.slice(0,boundary):cut)+"…";
}

  (t)=>"در بررسی «"+t+"»، کدام اصل را باید رعایت کرد؟",

chapters.forEach((c,ci)=>{
  const concepts=[...c.sections.map(x=>({title:x[0],summary:x[1]})),...c.supplemental.items.map(x=>({title:x[0],summary:x[1]}))];
  let n=0;
  while(c.quiz.length<25){
    const concept=concepts[n%concepts.length];
    const others=concepts.filter(x=>x.title!==concept.title&&x.summary!==concept.summary);
    const distractors=[];
    for(let k=0;k<others.length&&distractors.length<3;k++){
      const candidate=others[(n*3+k+ci)%others.length];
      const option=shortenOption(candidate.summary);
      if(option!==shortenOption(concept.summary)&&!distractors.includes(option))distractors.push(option);
    }
    while(distractors.length<3)distractors.push(["این موضوع فقط به نام‌گذاری تجهیزات مربوط است.","این موضوع به‌تنهایی سلامت کل سامانه را تضمین می‌کند.","برای این موضوع نیازی به آزمون عملی نیست."][distractors.length]);
    const correct=shortenOption(concept.summary);
    const answerIndex=(n*7+ci)%4;
    const options=distractors.slice();
    options.splice(answerIndex,0,correct);
    c.quiz.push({
      q:questionStems[n%questionStems.length](concept.title),
      o:options,
      a:answerIndex,
      e:"مفهوم اصلی: "+concept.summary+"\\n\\nدر عمل، این اصل را در شرایط واقعی پروژه بررسی کنید و نتیجه را با مشاهده، اندازه‌گیری یا مستندات معتبر تأیید کنید.",
      kind:"تمرین مفهومی تکمیلی"
    });
    n++;
  }
});

function applyToolPreset(name){
 const p=({default:{n:8,w:8,poe:20,rate:4,margin:25,days:14,link:1000},shop:{n:8,w:8,poe:20,rate:4,margin:25,days:14,link:1000},site:{n:16,w:10,poe:25,rate:6,margin:25,days:30,link:1000},yard:{n:24,w:15,poe:25,rate:8,margin:30,days:30,link:2500}})[name]||{n:8,w:8,poe:20,rate:4,margin:25,days:14,link:1000};
 [["poeCount",p.n],["poeWatts",p.w],["poeReserve",p.poe],["bwCount",p.n],["bwRate",p.rate],["bwReserve",p.margin],["hddCount",p.n],["hddRate",p.rate],["hddDays",p.days],["linkLoad",p.n*p.rate*(1+p.margin/100)],["linkSpeed",p.link],["linkLimit",70]].forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.value=v});
 const labels={default:"مقادیر پیش‌فرض بارگذاری شد.",shop:"سناریوی فروشگاه/دفتر کوچک بارگذاری شد.",site:"سناریوی ساختمان اداری بارگذاری شد.",yard:"سناریوی محوطه و پارکینگ بارگذاری شد."};const status=document.getElementById("presetStatus");if(status)status.textContent=labels[name]||labels.default;
 calculatePoE();calculateBandwidth();calculateStorage();calculateLink();
}
function calculateLink(){
 const load=calcNum("linkLoad",0.1,1000000),speed=calcNum("linkSpeed",1,1000000),limit=calcNum("linkLimit",1,100);const out=$("#linkResult");if([load,speed,limit].some(v=>v===null)){out.textContent="مقادیر را در محدوده مجاز وارد کن.";return}
 const pct=load/speed*100,remaining=Math.max(0,speed-load),status=pct>limit?"status-bad":pct>limit*.8?"status-warn":"status-good";const advice=pct>limit?"بالاتر از حد طراحی است؛ ظرفیت لینک یا تقسیم ترافیک را بازبینی کن.":pct>limit*.8?"به حد طراحی نزدیک است؛ ترافیک سایر سرویس‌ها را هم بررسی کن.":"در محدوده حد طراحی واردشده است؛ ظرفیت واقعی تجهیزات را هم بررسی کن.";
 out.innerHTML="اشغال برآوردی لینک: <b class='"+status+"'>"+pct.toFixed(1)+"٪</b><br>ظرفیت اسمی باقی‌مانده: <b>"+remaining.toFixed(1)+" Mbps</b><br>"+advice;
}

function calcNum(id,min,max){
 const el=document.getElementById(id),v=el?Number(el.value):NaN;
 if(!Number.isFinite(v)||v<min||v>max){if(el)el.setAttribute("aria-invalid","true");return null}
 el.removeAttribute("aria-invalid");return v;
}
function calculatePoE(){
 const n=calcNum("poeCount",1,1000),w=calcNum("poeWatts",0.1,200),r=calcNum("poeReserve",0,100);
 const out=$("#poeResult");if([n,w,r].some(v=>v===null)){out.textContent="مقادیر را در محدوده مجاز وارد کن.";return}
 const base=n*w,total=base*(1+r/100);
 out.innerHTML="مصرف پایه: <b>"+base.toFixed(1)+" وات</b><br>با ذخیره "+r+"٪: <b>"+total.toFixed(1)+" وات</b><br>سوئیچ را با بودجه توان PoE کل بالاتر از این مقدار و توان مجاز هر پورت انتخاب کن.";
}
function calculateBandwidth(){
 const n=calcNum("bwCount",1,1000),rate=calcNum("bwRate",0.1,500),r=calcNum("bwReserve",0,100);
 const out=$("#bwResult");if([n,rate,r].some(v=>v===null)){out.textContent="مقادیر را در محدوده مجاز وارد کن.";return}
 const base=n*rate,total=base*(1+r/100);
 out.innerHTML="مجموع نرخ تصویر: <b>"+base.toFixed(1)+" Mbps</b><br>با حاشیه "+r+"٪: <b>"+total.toFixed(1)+" Mbps</b><br>معادل تقریبی: <b>"+(total/1000).toFixed(2)+" Gbps</b><br>این مقدار را با ظرفیت واقعی لینک‌ها، uplink سوئیچ، NVR و ترافیک هم‌زمان مقایسه کن.";
}
function calculateStorage(){
 const n=calcNum("hddCount",1,1000),rate=calcNum("hddRate",0.1,500),days=calcNum("hddDays",1,365);
 const out=$("#hddResult");if([n,rate,days].some(v=>v===null)){out.textContent="مقادیر را در محدوده مجاز وارد کن.";return}
 const tb=n*rate*10.8*days/1000,withHeadroom=tb*1.1;
 out.innerHTML="ظرفیت داده تخمینی: <b>"+tb.toFixed(2)+" TB</b><br>با ۱۰٪ حاشیه: <b>"+withHeadroom.toFixed(2)+" TB</b><br>برای طراحی نهایی، ظرفیت قابل استفاده دیسک، RAID در صورت وجود، فرمت ضبط و نرخ بیت واقعی را لحاظ کن.";
}

function diagramHTML(c){
 const text=(c.title+" "+c.desc+" "+c.sections.map(x=>x.join(" ")).join(" ")).toLowerCase();
 const matches=diagramPatterns.map(p=>({...p,score:p.keys.reduce((n,k)=>n+(text.includes(k.toLowerCase())?1:0),0)})).filter(p=>p.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
 const chosen=matches.length?matches:[diagramPatterns[diagramPatterns.length-1]];
 return '<section class="supplement"><h2>الگوهای متنی تجهیزات و اتصال‌ها</h2><p class="lesson-intro">شماتیک‌ها آموزشی‌اند و نقشه اجرایی مقیاس‌دار نیستند. نام دقیق پورت‌ها، توان، سرعت و روش اتصال را با مدل دستگاه و راهنمای سازنده تطبیق بده.</p><div class="diagram-grid">'+chosen.map(p=>'<article class="diagram-card"><h3>'+esc(p.title)+'</h3><pre>'+esc(p.diagram)+'</pre><p><b>چطور کار می‌کند؟</b> '+esc(p.meaning)+'</p><b>چک‌لیست نصب و عیب‌یابی</b><ul>'+p.checks.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+technicalDetailHTML(p)+'<p class="diagram-note">'+esc(p.note)+'</p></article>').join('')+'</div></section>';
}

if(i===0) body='<div class="lab-mission"><div class="lab-panel"><span class="lab-chip">سناریو 01 · شبکه</span><h3>تصویر دوربین باز نمی‌شود</h3><p>چراغ لینک روشن است؛ رایانه و دوربین ظاهراً در یک شبکه‌اند؛ NVR دوربین را آفلاین نشان می‌دهد. هنوز هیچ قطعه‌ای تعویض نشده است.</p><label class="lab-label">اولین آزمون را انتخاب کن<select class="lab-input" id="netSymptom" onchange="labNetwork()"><option value="ping">پینگ دوربین موفق است</option><option value="nop ping">پینگ ناموفق است</option><option value="duplicate">گاهی تصویر قطع و وصل می‌شود</option></select></label><button class="lab-action" onclick="labNetwork()">اجرای آزمون و دریافت سرنخ</button><div class="lab-result" id="netResult" aria-live="polite">یک نشانه را انتخاب کن؛ نتیجه آزمایش و قدم بعدی نمایش داده می‌شود.</div></div><div class="lab-panel"><h3>نقشه تشخیص</h3><div class="lab-flow"><span>برق و لینک</span><b>↓</b><span>IP و VLAN</span><b>↓</b><span>پورت و احراز هویت</span><b>↓</b><span>جریان ویدئو / NVR</span></div><p class="lab-note">اصل کار: هر بار یک فرضیه را با یک آزمون قابل‌اندازه‌گیری بررسی کن.</p></div></div>';
else if(i===1) body='<div class="lab-mission"><div class="lab-panel"><span class="lab-chip">آزمایش اپتیک</span><h3>لنز مناسب برای هدف</h3><label class="lab-label">هدف<select class="lab-input" id="opticGoal" onchange="labOptics()"><option value="overview">نمای کلی فروشگاه</option><option value="face">جزئیات چهره ورودی</option><option value="plate">پلاک خودرو</option></select></label><label class="lab-label">فاصله تا هدف: <b id="opticDistanceLabel">8</b> متر<input class="lab-range" id="opticDistance" type="range" min="2" max="40" value="8" oninput="labOptics()"></label><label class="lab-label">فاصله کانونی: <b id="opticFocalLabel">4</b> میلی‌متر<input class="lab-range" id="opticFocal" type="range" min="2" max="12" value="4" oninput="labOptics()"></label><div class="lab-scene"><div class="lab-camera">◉</div><div class="lab-cone" id="opticCone"></div><div class="lab-person" id="opticTarget">●</div></div><div class="lab-result" id="opticResult" aria-live="polite"></div></div><div class="lab-panel"><h3>چیزی که باید بفهمی</h3><div class="lab-concept"><b>لنز کوتاه‌تر</b><p>میدان دید وسیع‌تر؛ جزئیات هر سوژه در همان فاصله معمولاً کمتر.</p></div><div class="lab-concept"><b>فاصله بیشتر</b><p>هدف کوچک‌تر دیده می‌شود؛ مگاپیکسل بیشتر به‌تنهایی مشکل زاویه و نور را حل نمی‌کند.</p></div><p class="lab-note">این مدل آموزشی تقریبی است، نه تضمین شناسایی چهره یا پلاک.</p></div></div>';
else if(i===2) body='<div class="lab-mission"><div class="lab-panel"><span class="lab-chip">طراحی با داده</span><h3>پروژه ۱۲ دوربینه</h3><div class="lab-form-grid"><label class="lab-label">تعداد دوربین<input class="lab-input" id="sysCams" type="number" min="1" max="256" value="12" oninput="labSystem()"></label><label class="lab-label">Mbps هر دوربین<input class="lab-input" id="sysRate" type="number" min="0.2" max="50" step="0.1" value="4" oninput="labSystem()"></label><label class="lab-label">ساعت ضبط روزانه<input class="lab-input" id="sysHours" type="number" min="1" max="24" value="24" oninput="labSystem()"></label><label class="lab-label">روز نگهداری<input class="lab-input" id="sysDays" type="number" min="1" max="120" value="14" oninput="labSystem()"></label><label class="lab-label">بودجه PoE سوئیچ (وات)<input class="lab-input" id="sysPoe" type="number" min="15" max="2000" value="120" oninput="labSystem()"></label><label class="lab-label">مصرف هر دوربین (وات)<input class="lab-input" id="sysWatt" type="number" min="1" max="60" value="8" oninput="labSystem()"></label></div><div class="lab-metrics" id="sysMetrics" aria-live="polite"></div><p class="lab-note">برآورد ذخیره بر مبنای نرخ بیت ثابت است؛ حاشیه ظرفیت، RAID، سربار و تغییرات صحنه را جدا لحاظ کن.</p></div><div class="lab-panel"><h3>چک مهندسی</h3><div class="lab-concept"><b>شبکه</b><p>ترافیک خام تنها معیار نیست؛ ظرفیت uplink، ترافیک مشاهده زنده و حاشیه رشد را هم بسنج.</p></div><div class="lab-concept"><b>ضبط‌کننده</b><p>ظرفیت ورودی NVR و تعداد کانال‌ها باید با هم سازگار باشند.</p></div><div class="lab-concept"><b>توان</b><p>توان کل کافی نیست؛ محدودیت هر پورت و استاندارد PoE هم مهم است.</p></div></div></div>';
else if(i===3) body='<div class="lab-mission"><div class="lab-panel"><span class="lab-chip">بازدید فرضی: ورودی فروشگاه</span><h3>ریسک را به اقدام تبدیل کن</h3><p>هر موردی را که در بازدید کشف می‌کنی علامت بزن. ابزار، تعداد موارد بررسی‌شده و اقدام‌های اولویت‌دار را نشان می‌دهد.</p>'+["نور پشت سوژه شدید است","کابل شبکه از مسیر در دسترس عموم می‌گذرد","دوربین ورودی نقطه کور دارد","رک در محل بدون تهویه نصب شده","دسترسی سرویس در ارتفاع ناایمن است","باران یا گردوغبار به اتصالات می‌رسد"].map((x,n)=>'<label class="lab-check"><input type="checkbox" class="siteRisk" onchange="labSiteSurvey()"><span>'+x+'</span></label>').join("")+'<div class="lab-result" id="siteResult" aria-live="polite">هنوز بازدیدی ثبت نشده است.</div></div><div class="lab-panel"><h3>خروجی حرفه‌ای بازدید</h3><p>یافته را به شکل «مشاهده ← پیامد ← اقدام ← مسئول/موعد» ثبت کن.</p><div class="lab-concept"><b>مثال</b><p>کابل در دسترس است ← احتمال قطع عمدی ← انتقال به مسیر محافظت‌شده ← مسئول نصب، پیش از تحویل.</p></div><p class="lab-note">این چک‌لیست جای ارزیابی ایمنی محل و الزامات پروژه را نمی‌گیرد.</p></div></div>';
else if(i===4) body='<div class="lab-mission"><div class="lab-panel"><span class="lab-chip">سناریوی امنیت</span><h3>دسترسی راه دور برای مشاهده تصویر</h3><p>نصاب می‌خواهد برای راحتی، رمز پیش‌فرض را نگه دارد و چند پورت را روی روتر باز کند. امن‌ترین مسیر کدام است؟</p><div class="lab-options"><button class="lab-choice" onclick="labSecurity(0)">بازکردن همه پورت‌ها و نگه‌داشتن رمز برای پشتیبانی سریع</button><button class="lab-choice" onclick="labSecurity(1)">تغییر رمز، به‌روزرسانی، محدودسازی دسترسی و روش امن راه دور</button><button class="lab-choice" onclick="labSecurity(2)">فقط تغییر شماره پورت و باقی‌گذاشتن تنظیمات پیش‌فرض</button></div><div class="lab-result" id="securityResult" aria-live="polite"></div></div><div class="lab-panel"><h3>چک‌لیست سخت‌سازی</h3>'+["حذف حساب‌ها و رمزهای پیش‌فرض","به‌روزرسانی از منبع معتبر","غیرفعال‌سازی سرویس‌های غیرضروری","محدودکردن دسترسی مدیریتی","ثبت و بازبینی رخدادها"].map(x=>'<div class="lab-check static"><span class="lab-check-dot">✓</span><span>'+x+'</span></div>').join("")+'<p class="lab-note">تغییر پورت به‌تنهایی کنترل امنیتی کافی نیست.</p></div></div>';
else if(i===5) body='<div class="lab-mission"><div class="lab-panel"><span class="lab-chip">حادثه: NVR از کار افتاده</span><h3>زمان بازیابی در برابر داده ازدست‌رفته</h3><p>برای این پروژه، توقف ضبط بیشتر از ۲ ساعت پذیرفتنی نیست. نسخه پشتیبان تنظیمات مربوط به ۷ روز قبل است.</p><label class="lab-label">هدف زمان بازیابی RTO: <b id="rtoLabel">2</b> ساعت<input class="lab-range" id="rtoRange" type="range" min="1" max="24" value="2" oninput="labRecovery()"></label><label class="lab-label">حد قابل‌قبول ازدست‌رفتن داده RPO: <b id="rpoLabel">15</b> دقیقه<input class="lab-range" id="rpoRange" type="range" min="0" max="1440" step="15" value="15" oninput="labRecovery()"></label><div class="lab-result" id="recoveryResult" aria-live="polite"></div></div><div class="lab-panel"><h3>تصمیم درست در بحران</h3><div class="lab-flow"><span>ایمن‌سازی وضعیت و ثبت رخداد</span><b>↓</b><span>تعیین دامنه خرابی</span><b>↓</b><span>بازیابی کنترل‌شده و آزمون ضبط</span></div><p class="lab-note">پشتیبان تنظیمات با آرشیو ویدئو یکی نیست. برنامه باید هر دو را پوشش دهد.</p></div></div>';
else if(i===6) body='<div class="lab-mission"><div class="lab-panel"><span class="lab-chip">تصمیم‌گیری با ریسک</span><h3>خطر قطع کابل در مسیر عمومی</h3><label class="lab-label">احتمال وقوع: <b id="riskProbLabel">4</b> از ۵<input class="lab-range" id="riskProb" type="range" min="1" max="5" value="4" oninput="labRisk()"></label><label class="lab-label">شدت پیامد: <b id="riskImpactLabel">5</b> از ۵<input class="lab-range" id="riskImpact" type="range" min="1" max="5" value="5" oninput="labRisk()"></label><div class="lab-risk-grid" id="riskGrid"></div><div class="lab-result" id="riskResult" aria-live="polite"></div></div><div class="lab-panel"><h3>امتیاز پایان کار نیست</h3><p>امتیاز احتمال × پیامد فقط برای اولویت‌بندی اولیه است. یک ریسک با امتیاز بالا باید مالک، اقدام کاهشی و موعد بازبینی داشته باشد.</p><div class="lab-concept"><b>اقدام کاهشی نمونه</b><p>مسیر کابل را محافظت کن، دسترسی فیزیکی را کم کن و پس از اجرا سلامت لینک را دوباره آزمایش کن.</p></div></div></div>';
else if(i===7) body='<div class="lab-mission"><div class="lab-panel"><span class="lab-chip">تطبیق مفهوم</span><h3>هر فناوری را در جای خودش قرار بده</h3><p>برای هر توضیح، نزدیک‌ترین مفهوم را انتخاب کن و بعد نتیجه را بررسی کن.</p><div class="lab-match"><label class="lab-label">۱. فشرده‌سازی جریان ویدئو<select id="match1" class="lab-input"><option value="">انتخاب کن…</option><option value="codec">کدک</option><option value="poe">PoE</option><option value="security">کنترل امنیت اطلاعات</option></select></label><label class="lab-label">۲. انتقال برق و داده روی کابل شبکه<select id="match2" class="lab-input"><option value="">انتخاب کن…</option><option value="codec">کدک</option><option value="poe">PoE</option><option value="security">کنترل امنیت اطلاعات</option></select></label><label class="lab-label">۳. مدیریت دسترسی و کاهش ریسک سازمانی<select id="match3" class="lab-input"><option value="">انتخاب کن…</option><option value="codec">کدک</option><option value="poe">PoE</option><option value="security">کنترل امنیت اطلاعات</option></select></label><button class="lab-action" onclick="labMatch()">بررسی تطبیق‌ها</button><div class="lab-result" id="matchResult" aria-live="polite"></div></div><div class="lab-panel"><h3>نکته مفهومی</h3><p>استاندارد فنی، قانون، راهنما و گواهی یک معنا ندارند. برای پروژه واقعی، نسخه جاری و الزام قراردادی یا قانونی را جداگانه بررسی کن.</p></div></div>';
else if(i===8) body='<div class="lab-mission"><div class="lab-panel"><span class="lab-chip">درخت تصمیم</span><h3>کدام تست بعدی بیشترین ارزش را دارد؟</h3><label class="lab-label">نشانه مشاهده‌شده<select class="lab-input" id="diagSymptom" onchange="labDiagnosis()"><option value="offline">NVR دوربین را آفلاین نشان می‌دهد</option><option value="intermittent">تصویر قطع و وصل می‌شود</option><option value="black">دوربین آنلاین است ولی تصویر سیاه است</option><option value="delay">تصویر با تأخیر یا مکث نمایش داده می‌شود</option></select></label><div class="lab-result" id="diagResult" aria-live="polite"></div></div><div class="lab-panel"><h3>قاعده عیب‌یابی</h3><div class="lab-flow"><span>مشاهده دقیق</span><b>↓</b><span>آزمون کم‌هزینه و کم‌خطر</span><b>↓</b><span>تفسیر نتیجه</span><b>↓</b><span>آزمون بعدی</span></div><p class="lab-note">یک علامت ممکن است چند علت داشته باشد؛ نتیجه آزمون را ثبت کن و زود نتیجه‌گیری نکن.</p></div></div>';
else if(i===9) body='<div class="lab-mission"><div class="lab-panel"><span class="lab-chip">تحلیل تصویر شب</span><h3>تصویر شب سفید و مه‌آلود شده</h3><p>دوربین پشت شیشه نصب شده و IR فعال است. پیش از پیشنهاد تعویض دوربین، فرضیه‌ها را آزمایش کن.</p><label class="lab-label">عامل آزمایشی<select class="lab-input" id="nightTest" onchange="labNight()"><option value="glass">بازتاب IR از شیشه</option><option value="lens">کثیفی یا بخار روی لنز</option><option value="gain">Gain / نوردهی بیش‌ازحد</option><option value="light">ضدنور یا منبع نور نزدیک</option></select></label><button class="lab-action" onclick="labNight()">بررسی فرضیه</button><div class="lab-result" id="nightResult" aria-live="polite"></div></div><div class="lab-panel"><h3>روش علمی</h3><div class="lab-concept"><b>۱. مشاهده</b><p>ثبت نمونه تصویر در شرایط واقعی شب.</p></div><div class="lab-concept"><b>۲. جداسازی متغیر</b><p>یک تنظیم یا عامل را در هر نوبت تغییر بده.</p></div><div class="lab-concept"><b>۳. تأیید</b><p>تصویر را دوباره ثبت کن و نتیجه را مقایسه کن.</p></div></div></div>';
else if(i===10) body='<div class="lab-mission"><div class="lab-panel"><span class="lab-chip">آزمایشگاه لایه‌ها</span><h3>پینگ موفق است؛ تصویر هنوز نیست</h3><p>هر تست چه چیزی را ثابت می‌کند؟ یکی را انتخاب کن.</p><div class="lab-options"><button class="lab-choice" onclick="labLayers(0)">Ping به IP دوربین</button><button class="lab-choice" onclick="labLayers(1)">آزمون پورت و سرویس ویدئو</button><button class="lab-choice" onclick="labLayers(2)">بررسی احراز هویت و جریان در NVR</button></div><div class="lab-result" id="layerResult" aria-live="polite"></div></div><div class="lab-panel"><h3>از تست تا ادعا</h3><div class="lab-flow"><span>IP reachable</span><b>≠</b><span>سرویس سالم</span><b>≠</b><span>ویدئوی قابل‌نمایش</span></div><p class="lab-note">هر آزمون فقط درباره همان چیزی شاهد می‌دهد که واقعاً اندازه می‌گیرد.</p></div></div>';

function labNetwork(){const v=document.getElementById("netSymptom")?.value,out=document.getElementById("netResult");if(!out)return;const m={"ping":"پینگ موفق فقط نشان می‌دهد IP در سطح ICMP پاسخ می‌دهد. قدم بعدی: از همان VLAN پورت/سرویس موردنیاز را آزمایش کن، سپس اعتبارنامه و جریان سازگار با NVR را بررسی کن.","nop ping":"ابتدا برق و لینک را تأیید کن؛ سپس IP، subnet، VLAN و جدول ARP را بررسی کن. اگر لینک روشن است اما پینگ شکست می‌خورد، هنوز خرابی دوربین ثابت نشده است.","duplicate":"قطع‌و‌وصل متناوب می‌تواند از IP تکراری، کابل/سوکت معیوب، افت PoE یا ازدحام باشد. لاگ سوئیچ و تداخل IP را بررسی کن و هر بار فقط یک متغیر را تغییر بده."};out.textContent=m[v]||"نشانه را انتخاب کن."}

function labSystem(){const val=id=>Math.max(0,Number(document.getElementById(id)?.value)||0),n=Math.max(1,val("sysCams")),r=Math.max(.1,val("sysRate")),h=Math.min(24,Math.max(1,val("sysHours"))),d=Math.min(120,Math.max(1,val("sysDays"))),p=val("sysPoe"),w=val("sysWatt"),bw=n*r,storage=bw*3600*h*d/8/1000000;const el=document.getElementById("sysMetrics");if(!el)return;const tb=(storage/1000);el.innerHTML='<div class="lab-metric"><small>ترافیک خام دوربین‌ها</small><strong>'+bw.toFixed(1)+' Mbps</strong><em>با ۲۵٪ حاشیه: '+(bw*1.25).toFixed(1)+' Mbps</em></div><div class="lab-metric"><small>فضای ضبط تخمینی</small><strong>'+tb.toFixed(2)+' TB</strong><em>بدون RAID و سربار</em></div><div class="lab-metric"><small>مصرف PoE تخمینی</small><strong>'+(n*w).toFixed(0)+' W</strong><em>بودجه واردشده: '+p+' W</em></div><div class="lab-metric"><small>نتیجه اولیه</small><strong style="color:'+(n*w>p?'#ff9aa7':'#82e8df')+'">'+(n*w>p?'بودجه PoE ناکافی':'بودجه PoE روی کاغذ کافی')+'</strong><em>'+(n*w>p?'توان بیشتر یا تقسیم بار لازم است.':'توان هر پورت و حاشیه را هم بررسی کن.')+'</em></div>'}

function chapterLabAnswer(chapter,answer){
const keys={0:1,4:1,5:1,7:0,8:0,9:1,10:0,12:0};
const explanations={0:["تعویض قطعه بدون آزمون هزینه‌زاست.","درست است؛ با روشن‌بودن لینک، تداخل IP، VLAN و سرویس را مرحله‌ای بررسی کن.","تغییر subnet بدون نقشه می‌تواند خرابی بیشتری ایجاد کند."],4:["رمز پیش‌فرض ریسک جدی ایجاد می‌کند.","درست است؛ سخت‌سازی، به‌روزرسانی و محدودسازی دسترسی را در برنامه تحویل بگذار.","بازکردن غیرضروری پورت‌ها سطح حمله را افزایش می‌دهد."],5:["بازیابی بدون ارزیابی ممکن است شواهد یا داده را از بین ببرد.","درست است؛ ابتدا وضعیت را ارزیابی و سرویس را با برنامه بازیابی کن.","نسخه پشتیبان را حذف نکن؛ نگهداری نسخه‌های سالم بخشی از بازیابی است."],7:["درست است؛ چارچوب‌های امنیت اطلاعات برای مدیریت ریسک و کنترل‌ها به کار می‌روند.","این یک کدک ویدئو است، نه چارچوب امنیت اطلاعات.","PoE مربوط به تغذیه تجهیزات است و به‌تنهایی چارچوب امنیت اطلاعات نیست."],8:["درست است؛ ابتدا آدرس‌دهی و دسترسی شبکه را بررسی کن.","هارد مربوط به ذخیره‌سازی است و اولین فرضیه برای آفلاین‌بودن یک دوربین نیست.","فوکوس روی وضوح اپتیکی اثر دارد، نه وضعیت اتصال شبکه."],9:["پیشنهاد تعویض بدون تشخیص علت، حرفه‌ای نیست.","درست است؛ بازتاب IR، شیشه، نور و تنظیمات را پیش از خرید بررسی کن.","رزولوشن بالاتر مشکل نور و بازتاب را لزوماً حل نمی‌کند."],10:["درست است؛ ping فقط بخشی از دسترس‌پذیری را می‌سنجد، نه سلامت کامل سرویس ویدئو.","پینگ آدرس IP را تغییر نمی‌دهد.","نمایش تصویر فقط وابسته به DNS نیست."],12:["درست است؛ هشدار سلامت دیسک و آزمون واقعی بازپخش مهم‌اند.","خاموش‌کردن هشدارها مشکل را پنهان می‌کند.","چراغ دستگاه به‌تنهایی ضبط و قابلیت بازپخش را ثابت نمی‌کند."]};
const box=document.getElementById("labFeedback");if(!box)return;const correct=keys[chapter]===answer;box.className="lab-feedback show";box.textContent=(correct?"✅ پاسخ مناسب. ":"🔎 دوباره بررسی کن. ")+(explanations[chapter]?.[answer]||"به توضیح درس و شواهد فنی رجوع کن.");
}
function updateLensLab(){const goal=document.getElementById("lensGoal"),distance=document.getElementById("lensDistance"),out=document.getElementById("lensOutput");if(!goal||!distance||!out)return;const d=Math.max(1,Math.min(100,Number(distance.value)||1));const advice={wide:"برای نمای کلی، میدان دید وسیع‌تر مناسب است؛ اما جزئیات افراد در فاصله دور کمتر می‌شود.",face:"برای تشخیص چهره، میدان دید و تراکم پیکسل روی چهره را در فاصله "+d+" متر بسنج؛ دوربین را نزدیک‌تر یا لنز مناسب‌تر انتخاب کن.",plate:"برای پلاک، زاویه نسبت به مسیر، سرعت خودرو، شاتر و نور IR را بسنج؛ زوم بیشتر به‌تنهایی تضمین نمی‌کند."};out.textContent=advice[goal.value]+ " فاصله ورودی: "+d+" متر. این راهنما کیفی است؛ برای طراحی دقیق به حسگر و فاصله کانونی نیاز است."}
function updateDesignLab(){const n=Math.max(1,Math.min(256,Number(document.getElementById("designCount")?.value)||1)),r=Math.max(.1,Math.min(50,Number(document.getElementById("designRate")?.value)||.1)),d=Math.max(1,Math.min(90,Number(document.getElementById("designDays")?.value)||1)),out=document.getElementById("designOutput");if(out)out.innerHTML="پهنای باند خام: <b>"+(n*r).toFixed(1)+" Mbps</b><br>با حاشیه ۲۵٪: <b>"+(n*r*1.25).toFixed(1)+" Mbps</b><br>ذخیره تخمینی ضبط پیوسته: <b>"+(n*r*10.8*d/1000).toFixed(2)+" TB</b> (بدون حاشیه و سربار)."}
function updateRiskChecklist(){const a=[...document.querySelectorAll(".riskCheck")],n=a.filter(x=>x.checked).length,out=document.getElementById("riskChecklistOutput");if(out)out.textContent=n+" مورد از "+a.length+" مورد بررسی شده است؛ "+(n===a.length?"بازدید این فهرست کامل شد، یافته‌ها را مستند کن.":"موارد باقی‌مانده را در بازدید بررسی کن.")}
function updateRiskMatrix(){const l=Number(document.getElementById("riskLikelihood")?.value||1),i=Number(document.getElementById("riskImpact")?.value||1),out=document.getElementById("riskMatrixOutput"),score=l*i;if(out)out.innerHTML="احتمال: "+l+" × پیامد: "+i+" = امتیاز <b>"+score+" از ۲۵</b><br>اولویت پیشنهادی: <b>"+(score>=15?"بالا؛ اقدام کاهشی سریع":score>=8?"متوسط؛ برنامه کاهش و بازبینی":"پایین‌تر؛ پایش و بازبینی دوره‌ای")+"</b>";}
function updateHandoverLab(){const a=[...document.querySelectorAll(".handoverCheck")],n=a.filter(x=>x.checked).length,out=document.getElementById("handoverOutput");if(out)out.textContent=n+" از "+a.length+" مورد تکمیل شده است؛ "+(n===a.length?"آماده بازبینی نهایی و مستندسازی.":"موارد باقی‌مانده را قبل از تحویل آزمایش کن.")}
function nextInterviewCard(){const q=["چطور تشخیص می‌دهی مشکل تصویر از شبکه است یا از خود دوربین؟","چرا بودجه PoE کل و توان هر پورت را باید جدا بررسی کرد؟","برای تعیین ظرفیت هارد چه اطلاعاتی از کارفرما می‌گیری؟","اگر دوربین شب تصویر سفید و مه‌آلود داشت، چه فرضیه‌هایی را آزمایش می‌کنی؟","چطور دسترسی مدیریتی دوربین‌ها را امن می‌کنی؟"];const el=document.getElementById("interviewQuestion");if(!el)return;const current=q.indexOf(el.textContent);el.textContent=q[(current+1)%q.length]}

function explanationHTML(q){
  const answer=esc(q.o[q.a]);
  const detail=esc(q.e||"برای این سؤال هنوز توضیح تخصصی کافی ثبت نشده است؛ این مورد باید با منبع آموزشی تطبیق داده شود.");
  const distractorIndex=q.o.findIndex((_,i)=>i!==q.a);
  const distractor=esc(q.o[distractorIndex]||"یکی از گزینه‌های دیگر");
  return '<details class="answer-explanation"><summary>مشاهده پاسخ تشریحی و تمرین مفهومی</summary><div class="explanation-body"><p><b>پاسخ صحیح:</b> '+answer+'</p><p><b>مفهوم و دلیل پاسخ:</b></p><p>'+detail.replace(/\n/g,"<br>")+'</p><div class="practice-task"><p><b>تمرین همین سؤال:</b> فرض کن همکارت گزینه «'+distractor+'» را انتخاب کرده است. با زبان خودت توضیح بده چرا این گزینه پاسخ دقیق سؤال نیست و پاسخ «'+answer+'» چگونه به خواسته سؤال مربوط می‌شود.</p><label class="practice-label">پاسخت را قبل از دیدن راهنما بنویس:</label><textarea class="practice-input" rows="3" placeholder="دلیل خودت را بنویس…"></textarea><details class="practice-guide"><summary>راهنمای بررسی پاسخ من</summary><p>بررسی کن که آیا (۱) مفهوم اصلی را درست تعریف کرده‌ای، (۲) توضیح داده‌ای چرا پاسخ صحیح با صورت سؤال سازگار است، و (۳) روشن کرده‌ای چرا گزینه دیگر به مفهوم متفاوتی اشاره می‌کند یا سؤال را پاسخ نمی‌دهد.</p><p><b>نکته کلیدی:</b> '+detail.replace(/\n/g,"<br>")+'</p></details></div></div></details>';
}
function quizHTML(comprehensive=false){
const qs=comprehensive?allQuiz():chapters[state.chapter].quiz.map((q,qi)=>({...q,chapter:state.chapter,qi,tag:chapters[state.chapter].title}));
const title=comprehensive?"آزمون جامع دوره":"آزمون فصل: "+chapters[state.chapter].title;
let score=0;if(state.quizSubmitted)qs.forEach((q,i)=>{if(Number(state.quizAnswers[i])===q.a)score++});
return `<div class="crumb"><button class="secondary" onclick="go('home')">داشبورد</button>　/　آزمون</div><section class="panel"><span class="pill">${comprehensive?"آزمون همه فصل‌ها":"آزمون فصل"}</span><h1 class="lesson-title">${title}</h1><p class="lesson-intro">برای هر پرسش یک گزینه انتخاب کنید. پس از ثبت، پاسخ صحیح و توضیح نمایش داده می‌شود.</p><div id="questions">${qs.map((q,i)=>`<div class="quiz-question"><h3>${i+1}. ${esc(q.q)}</h3><div class="muted" style="font-size:10px;margin-bottom:7px">نوع پرسش: ${esc(q.kind||"پرسش دانشی")}</div>${comprehensive?'<div class="muted" style="font-size:10px;margin-bottom:7px">فصل: '+esc(q.tag)+'</div>':""}${q.o.map((op,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${state.quizAnswers[i]===String(j)?"checked":""} ${state.quizSubmitted?"disabled":""} onchange="state.quizAnswers[${i}]=this.value"><span>${esc(op)}</span></label>`).join("")}${explanationHTML(q)}${state.quizSubmitted?`<div class="feedback ${Number(state.quizAnswers[i])===q.a?"good":"bad"}">${Number(state.quizAnswers[i])===q.a?"پاسخ درست است.":"پاسخ درست: "+esc(q.o[q.a])+"."} پس از مشاهده توضیح تشریحی، نکته‌های اصلی را مرور کنید.</div>`:""}</div>`).join("")}</div>
${state.quizSubmitted?`<div class="result"><h2 style="margin:0 0 5px">نتیجه: ${score} از ${qs.length}</h2><p style="margin:0;font-size:13px">درصد پاسخ درست: ${Math.round(score/qs.length*100)}٪</p><div class="progress" style="margin-top:12px;height:8px"><i style="width:${Math.round(score/qs.length*100)}%"></i></div></div>`:""}
<div class="quiz-toolbar">${state.quizSubmitted?'<button class="primary" onclick="retryQuiz()">تلاش دوباره</button>':'<button class="primary" onclick="submitQuiz('+comprehensive+')">ثبت پاسخ‌ها و مشاهده نتیجه</button>'}<button class="secondary" onclick="go('lesson',${state.chapter})">بازگشت به درس</button></div></section>`;
}
function savedHTML(){const list=chapters.map((c,i)=>({...c,i})).filter(c=>state.progress.done.includes(c.i));return `<div class="section-head"><div><h2>ادامه یادگیری</h2><p>فصل‌هایی که به‌عنوان مطالعه‌شده علامت زده‌اید.</p></div></div>${list.length?'<div class="course-grid">'+list.map(c=>`<button class="course" onclick="go('lesson',${c.i})"><div class="course-icon">✓</div><div class="course-body"><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><div class="course-foot"><span>تکمیل‌شده</span><div class="progress"><i style="width:100%"></i></div></div></div></button>`).join("")+'</div>':'<div class="panel empty">هنوز فصلی را تکمیل نکرده‌اید. از داشبورد یک فصل را باز کنید و پس از مطالعه آن را علامت بزنید.</div>'}<div class="lesson-actions"><button class="secondary" onclick="resetProgress()">پاک‌کردن پیشرفت ذخیره‌شده</button></div>`}
function wire(){document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));}
function markDone(i){if(!state.progress.done.includes(i))state.progress.done.push(i);saveProgress();render()}
function submitQuiz(comprehensive){state.quizSubmitted=true;const qs=comprehensive?allQuiz():chapters[state.chapter].quiz.map(q=>q);if(!comprehensive){const score=qs.reduce((n,q,i)=>n+(Number(state.quizAnswers[i])===q.a?1:0),0);state.progress.scores[state.chapter]=score;if(score===qs.length&&!state.progress.done.includes(state.chapter))state.progress.done.push(state.chapter);saveProgress()}render()}
function retryQuiz(){state.quizAnswers={};state.quizSubmitted=false;render()}
function resetProgress(){if(confirm("پیشرفت ذخیره‌شده این دوره روی همین دستگاه پاک شود؟")){state.progress={done:[],scores:{}};saveProgress();render()}}
$("#searchInput").addEventListener("input",e=>{state.query=e.target.value;state.view="all";render()});
$("#menuBtn").setAttribute("aria-expanded","false");$("#menuBtn").addEventListener("click",()=>{const opened=$("#sidebar").classList.toggle("open");$("#sidebarBackdrop").classList.toggle("open",opened);$("#menuBtn").setAttribute("aria-expanded",String(opened));$("#menuBtn").setAttribute("aria-label",opened?"بستن منو":"بازکردن منو");});
$("#closeMenuBtn").addEventListener("click",closeSidebar);
$("#sidebarBackdrop").addEventListener("click",closeSidebar);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSidebar()});
render();
</script>
