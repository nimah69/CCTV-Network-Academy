/* Cyber Academy theme — visual-only overrides */
:root{
 --bg:#080f1c;--panel:#101b2d;--ink:#e7effb;--muted:#9aabc3;--line:#293a52;
 --nav:#070e1a;--nav2:#14243b;--brand:#398bff;--brand2:#40d9e7;--teal:#28d9c0;
 --soft:#172e49;--good:#39d6a0;--bad:#ff8292;--shadow:0 14px 36px #00000024;
 color-scheme:dark
}
body{background:var(--bg);color:var(--ink)}
button,input{color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--brand2);outline-offset:3px}
.top{background:#0b1424ed;border-color:var(--line)}
.hamb{background:#122139;color:var(--ink);border-color:#344b68;min-width:44px;min-height:44px;justify-content:center}
.search input{background:#101d30;border-color:#30435e;color:var(--ink);min-height:44px}
.search input::placeholder{color:#879bb7}
.welcome{background:radial-gradient(ellipse at 8% 15%,#164a67 0,transparent 42%),linear-gradient(115deg,#0d192c,#142d50 70%,#153e5a)}
.welcome:after{border-color:#52d7e72b;box-shadow:0 0 0 35px #40d9e70b,0 0 0 70px #40d9e706}
.welcome .primary{background:#e8fbff;color:#09223a}
.stat,.panel,.course,.secondary,.quiz-question{background:var(--panel);border-color:var(--line);color:var(--ink)}
.stat-icon,.course-icon{background:#17304d;color:#6ed7ff}
.course:hover{border-color:#40d9e7;box-shadow:0 12px 30px #0003}
.course p,.course-foot,.stat small,.section-head p,.lesson-intro,.crumb{color:var(--muted)}
.progress{background:#25354b}
.pill{background:#153d4b;color:#7ce8e4}
.lesson-content{color:#dce7f7}
.lesson-content h3{color:#f0f6ff}
.callout{background:#102f34;border-right-color:var(--teal);color:#d6f7f1}
.supplement{border-top-color:var(--line)}
.supplement-item{background:#0d1727;border-color:#2b3e58}
.supplement-item summary{color:#e6f0ff}
.supplement-item p{color:#b6c5da}
.secondary{border-color:#344761;background:#142238}
.secondary:hover{border-color:var(--brand2);background:#1a3049}
.primary{background:linear-gradient(110deg,#2879e8,#19a9c4);color:#fff;min-height:44px}
.option{border-color:#2c405a;background:#0c1728;color:#dce8f8;min-height:44px}
.option:hover{border-color:#4389c7;background:#12243a}
.option:has(input:checked){border-color:var(--brand2);background:#123244}
.option input{accent-color:var(--brand2)}
.feedback.good{background:#10352f;color:#8af0c5}
.feedback.bad{background:#3a202b;color:#ffabb5}
.result{background:#12253a;border:1px solid #294c69;color:#e5f3ff}
.empty{color:var(--muted)}
.footer{color:#8498b5}
.side-note{background:#0c1727;border-color:#293a52}
.nav button{min-height:44px}
@media(max-width:850px){
 .side{background:#080f1c;border-left:1px solid #2b3e58}
 .side.open{box-shadow:-18px 0 50px #0008}
 .wrap{padding-bottom:30px}
 .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:520px){
 .stats{grid-template-columns:1fr}
 .welcome{border-radius:17px}
 .panel{border-radius:15px}
 .quiz-question{padding:13px}
 .lesson-actions{gap:8px}
 .lesson-actions button{flex:1 1 140px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}


.practice-task{margin-top:14px;padding:13px;border:1px solid #31516a;border-radius:10px;background:#101f31}
.practice-task>p{margin:0 0 10px}
.practice-label{display:block;font-size:12px;font-weight:bold;color:#b9e9f2;margin:8px 0}
.practice-input{display:block;width:100%;resize:vertical;min-height:82px;border:1px solid #38536d;border-radius:9px;padding:10px;background:#091625;color:#e7effb;font:inherit;font-size:13px;line-height:1.8}
.practice-input::placeholder{color:#8297b1}
.practice-guide{margin-top:10px;border-top:1px solid #2b4058;padding-top:9px}
.practice-guide summary{cursor:pointer;color:#7ce8e4;font-size:12px;font-weight:bold;padding:5px 0}
.practice-guide p{margin:8px 0}
/* Text-only wiring and equipment schematics */
.diagram-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.diagram-card{min-width:0;border:1px solid #2b4058;border-radius:12px;background:#0b1727;padding:13px}
.diagram-card h3{margin:0 0 7px;font-size:14px;color:#8de9ef}
.diagram-card p{font-size:12px;color:#c5d5e8}
.diagram-card pre{direction:ltr;text-align:left;white-space:pre;overflow-x:auto;max-width:100%;background:#07111e;color:#b9f4e7;border:1px solid #263d55;border-radius:9px;padding:12px;font:12px/1.7 ui-monospace,Consolas,monospace}
.diagram-card ul{padding-right:20px;font-size:12px;color:#c5d5e8}
.diagram-card li{margin:5px 0}
.diagram-note{font-size:11px!important;color:#8ea6c1!important}
@media(max-width:620px){.diagram-grid{grid-template-columns:1fr}.diagram-card pre{font-size:11px}}
/* Per-question teach-back explanation */
.answer-explanation{margin-top:12px;border:1px solid #2b5871;border-radius:12px;background:#0c1b2b;overflow:hidden}
.answer-explanation summary{cursor:pointer;list-style:none;padding:12px 14px;min-height:46px;display:flex;align-items:center;gap:9px;color:#79e6e9;font-size:12px;font-weight:bold}
.answer-explanation summary::-webkit-details-marker{display:none}
.answer-explanation summary:before{content:"＋";display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:#16384b;color:#7ce8e4;font-size:16px;flex-shrink:0}
.answer-explanation[open] summary:before{content:"−"}
.explanation-body{padding:0 14px 14px;color:#d5e4f5;font-size:13px;line-height:1.95}
.explanation-body p{margin:8px 0}
.explanation-body b{color:#f0f8ff}
.explanation-tip{padding:10px 12px;border-right:3px solid var(--teal);background:#102f34;border-radius:8px}
.quiz-question h3{line-height:1.8}
@media(max-width:520px){.answer-explanation summary{padding:11px;font-size:11px}.explanation-body{padding:0 11px 12px;font-size:12px}}
</style>
</head>

<script>
const chapters = [
{title:"مبانی شبکه",pages:"۱–۴",icon:"⌘",desc:"مفاهیم پایه شبکه و ارتباط دوربین‌های IP",intro:"پیش‌نیاز درک طراحی، نصب و عیب‌یابی سامانه‌های نظارت تصویری تحت شبکه.",sections:[
["مفاهیم پایه","شبکه مجموعه‌ای از دستگاه‌هاست که برای تبادل داده به هم متصل‌اند. در سامانه IP CCTV، دوربین، سوئیچ، NVR/VMS و ایستگاه مشاهده از طریق شبکه با یکدیگر ارتباط دارند."],
["آدرس‌دهی و سرویس‌ها","IP برای شناسایی منطقی دستگاه در شبکه استفاده می‌شود. Subnet مشخص می‌کند کدام آدرس‌ها در یک شبکه محلی قرار دارند. DHCP می‌تواند آدرس را به‌صورت خودکار تخصیص دهد و DNS نام دامنه را به آدرس IP تبدیل می‌کند."],
["ارتباط و جداسازی","Switch دستگاه‌های یک شبکه محلی را به هم متصل می‌کند؛ Router شبکه‌های متفاوت را مسیریابی می‌کند. VLAN جداسازی منطقی ایجاد می‌کند، اما به‌تنهایی جایگزین Firewall و ACL نیست."],
["پروتکل‌ها و زمان","Ping برای بررسی دسترس‌پذیری IP کمک می‌کند، ولی پاسخ‌دادن آن سلامت همه سرویس‌های تصویر را تضمین نمی‌کند. NTP برای هماهنگ‌سازی زمان دوربین‌ها، NVR و Logها اهمیت دارد."]],tips:"برای عیب‌یابی، از لایه‌های ساده‌تر مثل برق و لینک فیزیکی شروع کنید و بعد به IP، مسیریابی و سرویس تصویر برسید.",quiz:[
{q:"کدام سرویس معمولاً آدرس IP را به‌صورت خودکار اختصاص می‌دهد؟",o:["DNS","DHCP","NTP","H.265"],a:1,e:"DHCP برای تخصیص خودکار تنظیمات آدرس‌دهی شبکه به کار می‌رود."},
{q:"VLAN به‌تنهایی چه چیزی را تضمین نمی‌کند؟",o:["جداسازی منطقی","امنیت کامل بین شبکه‌ها","تقسیم دامنه‌های شبکه","سازمان‌دهی شبکه"],a:1,e:"برای کنترل ارتباط بین VLANها ممکن است Firewall و ACL لازم باشد."}]},
{title:"مبانی فنی CCTV",pages:"۴–۱۵",icon:"◉",desc:"انواع دوربین، تصویر، لنز و ویژگی‌های تصویربرداری",intro:"کیفیت نظارت فقط به عدد مگاپیکسل وابسته نیست؛ لنز، نور، زاویه و فشرده‌سازی نیز اثر دارند.",sections:[
["آنالوگ و IP","دوربین آنالوگ تصویر را در بستر سامانه آنالوگ منتقل می‌کند؛ دوربین IP داده ویدئویی را از طریق شبکه می‌فرستد و معمولاً تنظیمات و مدیریت شبکه‌ای دارد."],
["رزولوشن، FPS و Bitrate","Resolution تعداد پیکسل‌های تصویر را توصیف می‌کند. FPS تعداد فریم در ثانیه است. Bitrate میزان داده ویدئو در واحد زمان است و بر پهنای باند و فضای ذخیره‌سازی اثر می‌گذارد."],
["فشرده‌سازی و نرخ بیت","H.264 و H.265 کدک‌های فشرده‌سازی ویدئو هستند. کاهش Bitrate می‌تواند مصرف شبکه و ذخیره‌سازی را کم کند، اما در صورت تنظیم نامناسب جزئیات تصویر افت می‌کند. VBR نرخ بیت را متناسب با پیچیدگی صحنه تغییر می‌دهد."],
["لنز و نور","فاصله کانونی لنز، زاویه دید و جزئیات قابل مشاهده را تحت تأثیر قرار می‌دهد. Focus، نور محیط، Exposure و Motion Blur در وضوح نهایی نقش دارند."],
["ویژگی‌های تصویر","WDR برای صحنه‌هایی با اختلاف زیاد روشنایی مفید است؛ HLC برای مهار منابع نور شدید مانند چراغ خودرو کاربرد دارد. ICR فیلتر مرتبط با مادون قرمز است و IR برای تصویربرداری در تاریکی به کار می‌رود. انعکاس IR از شیشه یا سطوح نزدیک می‌تواند تصویر شب را خراب کند."]],tips:"برای شناسایی چهره یا پلاک، قبل از افزایش مگاپیکسل، هدف، فاصله، زاویه، لنز، نور و Pixel Density را بررسی کنید.",quiz:[
{q:"WDR در چه شرایطی اهمیت بیشتری دارد؟",o:["اختلاف شدید روشنایی در یک صحنه","افزایش ظرفیت HDD","تخصیص IP","جلوگیری از Loop"],a:0,e:"WDR به مدیریت صحنه‌هایی با نواحی خیلی روشن و خیلی تاریک کمک می‌کند."},
{q:"H.265 به چه چیزی مربوط است؟",o:["رمزنگاری شبکه","فشرده‌سازی ویدئو","کنترل دسترسی فیزیکی","هماهنگ‌سازی زمان"],a:1,e:"H.265 کدک فشرده‌سازی ویدئو است."}]},
{title:"طراحی و زیرساخت CCTV",pages:"۱۵–۲۹",icon:"▦",desc:"طراحی پوشش، شبکه، پهنای باند و ذخیره‌سازی",intro:"طراحی حرفه‌ای از نیاز امنیتی آغاز می‌شود و تا آزمایش، مستندسازی و نگهداری ادامه دارد.",sections:[
["نیازسنجی و پوشش","نقاط حساس، ورودی و خروجی، نقاط کور، نور، فاصله و هدف تصویر را مشخص کنید. اهداف می‌توانند Detection، Recognition یا Identification باشند و به سطح جزئیات متفاوت نیاز دارند."],
["شبکه و کابل‌کشی","تعداد دوربین‌ها، Bitrate هر دوربین، Uplink، ظرفیت سوئیچ، VLAN و مسیر کابل باید با هم بررسی شوند. چراغ Link خاموش معمولاً بررسی کابل، سوکت، Patch Panel، پورت سوئیچ، پورت دوربین و برق را ایجاب می‌کند."],
["پهنای باند","بار تقریبی شبکه از مجموع جریان‌های ویدئویی و ترافیک جانبی اثر می‌گیرد. ظرفیت واقعی باید با توجه به Bitrate، تعداد دوربین‌ها، ضبط، مشاهده زنده و سربار شبکه محاسبه و آزمایش شود."],
["ذخیره‌سازی و ضبط","ظرفیت Storage به تعداد دوربین‌ها، Bitrate، مدت نگهداری، ساعات ضبط و سیاست ضبط بستگی دارد. باید ظرفیت ورودی NVR، تعداد کانال‌ها، Codec و توان پردازشی نیز بررسی شود."],
["RAID، برق و پایداری","RAID می‌تواند تحمل خرابی دیسک یا دسترس‌پذیری را بهبود دهد، اما Backup نیست. UPS برای پشتیبانی برق تجهیزات حیاتی است؛ افزونگی و برنامه بازیابی باید متناسب با اهمیت محل طراحی شوند."]],tips:"صرف روشن‌شدن تصویر پایان کار نیست؛ Live، ضبط، Playback، شب/روز، ذخیره‌سازی، زمان و دسترسی کاربران را آزمایش کنید.",quiz:[
{q:"کدام مورد جایگزین Backup محسوب نمی‌شود؟",o:["نسخه پشتیبان جداگانه","آزمون بازیابی","RAID","نگهداری نسخه آفلاین"],a:2,e:"RAID و Backup اهداف متفاوتی دارند؛ RAID به‌تنهایی حذف یا رمزگذاری مخرب داده را پوشش نمی‌دهد."},
{q:"هنگام طراحی ظرفیت ذخیره‌سازی کدام عامل مهم است؟",o:["فقط رنگ دوربین","تعداد دوربین، Bitrate و مدت نگهداری","فقط نام شبکه","فقط نوع مانیتور"],a:1,e:"این عوامل مستقیماً بر حجم داده و ظرفیت موردنیاز اثر می‌گذارند."}]},
{title:"امنیت فیزیکی و محیطی",pages:"۲۹–۳۳",icon:"⬡",desc:"محافظت از دوربین، رک، تجهیزات و محل نصب",intro:"کنترل‌های فیزیکی باید مانع دست‌کاری تجهیزات شوند و از محیط و زیرساخت محافظت کنند.",sections:[
["موقعیت نصب","ارتفاع، زاویه، دسترسی افراد، امکان جابه‌جایی و پوشش نقاط حساس را ارزیابی کنید. محل نصب نامناسب ممکن است به نقطه کور یا آسیب‌پذیری فیزیکی منجر شود."],
["حفاظت محیطی","در انتخاب تجهیزات به شرایط محیطی، گردوغبار، رطوبت، دما و احتمال ضربه توجه کنید. کد IP برای حفاظت در برابر نفوذ جامدات و آب و کد IK برای مقاومت در برابر ضربه مکانیکی به کار می‌رود."],
["کشف دست‌کاری","Tamper Detection، پایش وضعیت و استفاده از دوربین مکمل در نقاط حساس می‌توانند به کشف جابه‌جایی یا ازکارافتادن کمک کنند. کنترل دسترسی به اتاق تجهیزات و رک نیز مهم است."],
["زیرساخت حیاتی","رک، NVR، سوئیچ و منبع تغذیه باید در محل کنترل‌شده قرار گیرند. مسیر کابل و برق اضطراری نیز بخشی از طراحی فیزیکی است."]],tips:"عدد IP و IK را با نیاز واقعی محل تطبیق دهید؛ به‌جای فرض‌کردن حفاظت مطلق، شرایط نصب و دستورالعمل سازنده را بررسی کنید.",quiz:[
{q:"کد IK عمدتاً به چه چیزی مربوط است؟",o:["فشرده‌سازی تصویر","مقاومت در برابر ضربه مکانیکی","آدرس‌دهی IP","ذخیره‌سازی ویدئو"],a:1,e:"IK برای طبقه‌بندی مقاومت در برابر ضربه مکانیکی استفاده می‌شود."},
{q:"برای دوربین در معرض دست‌کاری، کدام کنترل مرتبط است؟",o:["Tamper Detection","DNS","H.265","DHCP"],a:0,e:"Tamper Detection می‌تواند دست‌کاری یا تغییر وضعیت دوربین را تشخیص دهد."}]},
{title:"امنیت سایبری دوربین‌های IP",pages:"۳۳–۳۵",icon:"⌑",desc:"حساب‌ها، به‌روزرسانی، جداسازی شبکه و دسترسی راه دور",intro:"سامانه CCTV خود یک دارایی شبکه‌ای است و باید با کنترل‌های چندلایه محافظت شود.",sections:[
["حساب و دسترسی","رمزهای پیش‌فرض را تغییر دهید، حساب‌های فردی بسازید و حداقل سطح دسترسی لازم را اعمال کنید. با خروج کارکنان، حساب‌ها، VPN، کارت ورود و سایر مجوزها باید بازبینی شوند."],
["شبکه امن","دوربین‌ها را در صورت نیاز از شبکه‌های دیگر جدا کنید و ارتباطات را با Firewall و ACL کنترل کنید. VLAN به‌تنهایی امنیت کامل ایجاد نمی‌کند."],
["Firmware و سرویس‌ها","Firmware را طبق فرایند امن و سازگار با سازنده به‌روز نگه دارید؛ سرویس‌ها و پورت‌های غیرضروری را غیرفعال کنید و تنظیمات امن را مستند سازید."],
["دسترسی از راه دور","از قراردادن مستقیم رابط مدیریتی دوربین یا NVR روی اینترنت اجتناب کنید. دسترسی راه دور باید کنترل‌شده باشد؛ در جزوه VPN در مقایسه با Port Forwarding به‌عنوان گزینه امن‌تر مطرح شده است."],
["پایش و ثبت","Log، Monitoring، NTP و بازبینی دسترسی‌ها برای تحلیل حادثه و پاسخ‌گویی اهمیت دارند. در رخداد امنیتی، دسترسی را طبق رویه سازمان کنترل و شواهد را مستند کنید."]],tips:"رمز قوی ضروری است اما کافی نیست؛ Firmware، سرویس‌های باز، دسترسی فیزیکی، شبکه و پایش هم باید بررسی شوند.",quiz:[
{q:"چرا دوربین را معمولاً نباید مستقیماً به اینترنت وصل کرد؟",o:["چون کیفیت تصویر را زیاد می‌کند","چون سطح حمله و مواجهه سرویس مدیریتی را افزایش می‌دهد","چون IP نمی‌گیرد","چون NTP را غیرفعال می‌کند"],a:1,e:"در معرض اینترنت قرارگرفتن سرویس مدیریتی، سطح حمله را افزایش می‌دهد."},
{q:"حداقل سطح دسترسی (Least Privilege) یعنی چه؟",o:["همه کاربران مدیر باشند","هر کاربر فقط دسترسی لازم برای وظیفه‌اش را داشته باشد","رمزها حذف شوند","Log غیرفعال شود"],a:1,e:"اصل حداقل دسترسی، مجوزهای غیرضروری را کاهش می‌دهد."}]},
{title:"پشتیبان‌گیری و بازیابی بحران",pages:"۳۵–۳۶",icon:"↻",desc:"Backup، Disaster Recovery، RPO و RTO",intro:"جزوه این بخش را با عنوان «Backup و Disaster Recovery» معرفی می‌کند.",sections:[
["Backup","نسخه‌ای از اطلاعات یا تنظیمات برای بازیابی در صورت خرابی، حذف اشتباه، حمله یا حادثه است. داشتن Backup به‌تنهایی کافی نیست؛ بازیابی باید آزمایش شود."],
["Disaster Recovery","مجموعه فرآیندها و زیرساخت‌هایی برای بازگرداندن سرویس‌ها پس از حادثه جدی است؛ از جمله خرابی Storage یا Server، حمله سایبری، Ransomware، قطع برق، آتش‌سوزی یا سیل."],
["RPO و RTO","RPO حداکثر میزان قابل قبول از دست رفتن داده از نظر زمانی است؛ RTO هدف زمانی برای بازیابی سرویس است. در مثال جزوه، RPO یک ساعت و RTO دو ساعت بیان شده‌اند."],
["روش نگهداری نسخه","Backup باید منظم باشد، بازیابی آن آزمایش شود، در محل مناسب نگهداری و در برابر دسترسی غیرمجاز محافظت شود. نگهداری Offline یا جدا از سامانه اصلی در صورت نیاز، ریسک رخداد مشترک را کاهش می‌دهد."]],tips:"RPO درباره داده قابل‌از‌دست‌رفتن است؛ RTO درباره زمان هدف بازیابی سرویس. این دو را با هم اشتباه نگیرید.",quiz:[
{q:"RPO به چه چیزی مربوط است؟",o:["مدت زمان بازیابی سرویس","میزان داده قابل از دست رفتن از نظر زمانی","نوع لنز","تعداد کانال‌های NVR"],a:1,e:"RPO حداکثر میزان قابل قبول از دست رفتن داده را مشخص می‌کند."},
{q:"چرا Backup باید آزمایش بازیابی شود؟",o:["برای افزایش رزولوشن","برای اطمینان از قابل Restore بودن نسخه","برای حذف NTP","برای خاموش کردن RAID"],a:1,e:"داشتن نسخه پشتیبان بدون اطمینان از قابلیت بازیابی کافی نیست."}]},
{title:"مدیریت ریسک",pages:"۳۶–۳۷",icon:"◇",desc:"دارایی، تهدید، آسیب‌پذیری و درمان ریسک",intro:"مدیریت ریسک کمک می‌کند کنترل‌ها بر اساس دارایی‌ها، تهدیدها و پیامدهای واقعی انتخاب شوند.",sections:[
["واژگان کلیدی","Asset دارایی ارزشمند است؛ Threat عامل یا رویدادی است که می‌تواند آسیب ایجاد کند؛ Vulnerability ضعف قابل سوءاستفاده است؛ Risk ترکیبی از احتمال رویداد نامطلوب و پیامد آن است."],
["ارزیابی ریسک","Risk Assessment شامل شناسایی دارایی‌ها، تهدیدها، آسیب‌پذیری‌ها و ارزیابی ریسک‌های مربوط به آن‌هاست. مثال جزوه: دوربین ورودی دارایی است؛ خرابکاری تهدید و نصب در ارتفاع پایین آسیب‌پذیری است."],
["درمان ریسک","روش‌های متداول شامل کاهش، اجتناب، انتقال و پذیرش ریسک است. انتخاب روش باید متناسب با پیامد و شرایط سازمان باشد."],
["دفاع چندلایه","Defense in Depth به‌معنای تکیه‌نکردن به یک کنترل واحد است؛ محافظ فیزیکی، جداسازی شبکه، Firewall، احراز هویت، ثبت رویداد، پایش و Backup می‌توانند لایه‌های مکمل باشند."]],tips:"در سناریوهای آزمون، دارایی، تهدید، آسیب‌پذیری، پیامد و کنترل پیشنهادی را جداگانه مشخص کنید.",quiz:[
{q:"نصب دوربین ورودی در ارتفاع پایین که دست‌کاری آن آسان است، نمونه چیست؟",o:["دارایی","آسیب‌پذیری","Backup","RTO"],a:1,e:"ضعفی که امکان سوءاستفاده یا آسیب را افزایش دهد، آسیب‌پذیری است."},
{q:"Defense in Depth به چه معناست؟",o:["استفاده از یک رمز قوی به‌تنهایی","استفاده از چند لایه دفاعی مکمل","حذف Log","اتصال مستقیم به اینترنت"],a:1,e:"هدف این است که شکست یک کنترل باعث شکست کل سامانه نشود."}]},
{title:"استانداردها و چارچوب‌ها",pages:"۳۷–۳۸",icon:"▧",desc:"ISO، TIA-942، Tier و راهنماهای NIST",intro:"جزوه میان استاندارد، الزام قانونی یا قراردادی و راهنمای مرجع تمایز می‌گذارد.",sections:[
["استاندارد و الزام","استاندارد مجموعه الزامات یا قواعد پذیرفته‌شده است. همه استانداردها الزام قانونی نیستند؛ الزام می‌تواند از قانون، قرارداد، سازمان یا انتخاب داوطلبانه ناشی شود."],
["استانداردهای امنیت و تداوم","ISO/IEC 27001 درباره الزامات سیستم مدیریت امنیت اطلاعات است؛ ISO/IEC 27002 راهنمای کنترل‌های امنیت اطلاعات؛ ISO 22301 درباره مدیریت تداوم کسب‌وکار و ISO 31000 درباره مدیریت ریسک است."],
["مراکز داده","TIA-942 به زیرساخت مراکز داده، مانند ساختمان، برق، سرمایش، کابل‌کشی و امنیت فیزیکی می‌پردازد. ISO/IEC 22237 نیز مجموعه‌ای از استانداردها در حوزه امکانات و زیرساخت مراکز داده است."],
["Tier و NIST","در مدل شناخته‌شده Uptime Institute، Tier I تا Tier IV سطوحی برای قابلیت اطمینان و افزونگی زیرساخت مراکز داده‌اند؛ این مفهوم فقط مخصوص CCTV نیست. NIST راهنماها و چارچوب‌های فناوری و امنیت سایبری منتشر می‌کند و خودبه‌خود قانون ایران محسوب نمی‌شود."]],tips:"هنگام پاسخ به پرسش استانداردها، موضوع استاندارد را دقیق بگویید و الزام‌آور بودن را به قانون، قرارداد یا چارچوب مربوط وابسته بدانید.",quiz:[
{q:"ISO/IEC 27001 در جزوه به چه موضوعی مربوط است؟",o:["سیستم مدیریت امنیت اطلاعات","کدک ویدئو","حفاظت در برابر ضربه","فشرده‌سازی تصویر"],a:0,e:"ISO/IEC 27001 الزامات ISMS یا سیستم مدیریت امنیت اطلاعات را مشخص می‌کند."},
{q:"Tier در مدل مراکز داده بیانگر چیست؟",o:["رزولوشن دوربین","سطح قابلیت اطمینان و افزونگی زیرساخت","کد فشرده‌سازی","نوع آدرس IP"],a:1,e:"Tier به طبقه‌بندی قابلیت اطمینان و افزونگی زیرساخت مراکز داده مرتبط است."}]},
{title:"عیب‌یابی حرفه‌ای CCTV",pages:"۳۸–۴۰",icon:"⌕",desc:"عیب‌یابی مرحله‌ای قطع تصویر، تأخیر و مشکلات ضبط",intro:"به‌جای حدس‌زدن یا بررسی تصادفی، از نشانه‌ها برای محدودکردن محل مشکل استفاده کنید.",sections:[
["دوربین کاملاً Offline","به‌ترتیب برق دوربین، PoE، کابل، Link LED، پورت سوئیچ، IP، Ping، ARP، تنظیمات شبکه، Firmware و سپس NVR/VMS را بررسی کنید."],
["Link و Ping","اگر Link خاموش است، کابل، سوکت، Patch Panel، پورت سوئیچ و دوربین و برق را بررسی کنید. اگر Link روشن است ولی Ping پاسخ نمی‌دهد، IP/Subnet، تعارض IP، VLAN، ACL، Firewall و Routing از احتمالات هستند."],

{title:"توضیحات تکمیلی هوش مصنوعی",items:[["انتخاب لنز بر اساس هدف","زاویه دید باز، محدوده بیشتری را می‌پوشاند اما سوژه دورتر پیکسل کمتری خواهد داشت. لنز با فاصله کانونی بیشتر میدان دید باریک‌تری دارد و می‌تواند جزئیات سوژه دورتر را بهتر نشان دهد؛ انتخاب نهایی باید با نقشه و آزمایش میدانی انجام شود."],["نوردهی و حرکت","در نور کم، افزایش زمان نوردهی ممکن است تصویر را روشن‌تر کند ولی سوژه متحرک را محو می‌کند. افزایش Gain هم می‌تواند نویز را بیشتر کند. تنظیمات باید با سرعت حرکت سوژه و هدف مدرک تصویری متعادل شود."],["پهنای باند و فشرده‌سازی","Bitrate به صحنه، تعداد دوربین‌ها، وضوح، FPS، کدک و تنظیمات وابسته است. عددهای محاسباتی تخمین‌اند؛ برای طراحی نهایی، نرخ واقعی جریان و حاشیه ظرفیت شبکه را اندازه‌گیری کنید."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["DVR، NVR و XVR","DVR معمولاً برای ورودی‌های دوربین آنالوگ استفاده می‌شود؛ NVR برای جریان دوربین‌های IP طراحی شده است؛ XVR در بسیاری از محصولات از چند نوع سیگنال دوربین پشتیبانی می‌کند. سازگاری دقیق را از مشخصات همان مدل بررسی کنید."],["PoE و توان","PoE می‌تواند برق و داده را روی کابل اترنت منتقل کند. استاندارد، توان قابل ارائه پورت و بودجه توان کل سوئیچ را بررسی کنید؛ مجموع مصرف دوربین‌ها، به‌ویژه هنگام فعال شدن IR یا گرم‌کن، نباید از بودجه مجاز فراتر رود."],["ONVIF و سازگاری","وجود نشان ONVIF به معنی تضمین تمام قابلیت‌ها نیست. Profile، نسخه، قابلیت‌های پیاده‌سازی‌شده و سازگاری واقعی میان دوربین و NVR را پیش از خرید آزمایش کنید."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["بودجه ذخیره‌سازی","برآورد اولیه حجم ویدئو از جمع Bitrate دوربین‌ها، زمان ضبط و ضریب تبدیل بیت به بایت به دست می‌آید؛ سربار، تغییر نرخ بیت، RAID و فضای قابل استفاده باید جداگانه لحاظ شوند. ظرفیت تبلیغ‌شده هارد با ظرفیت قابل استفاده یکسان نیست."],["HDD نظارتی","در انتخاب هارد به کاربری نظارتی، بار نوشتن، تعداد جریان‌ها، سازگاری NVR و توصیه سازنده توجه کنید. سلامت دیسک و هشدارهای SMART را پایش کنید؛ RAID هم جای Backup را نمی‌گیرد."],["Retention و سیاست نگهداری","مدت نگهداری باید بر اساس نیاز عملیاتی، مقررات و سیاست سازمان تعیین شود. ضبط دائمی، تشخیص حرکت و نرخ فریم متغیر هرکدام بر ظرفیت و احتمال از دست رفتن لحظه‌های مهم اثر دارند."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["کابل مسی و محدودیت مسیر","در اترنت مسی، طول کانال استاندارد معمولاً تا ۱۰۰ متر است (با توجه به نوع کابل و اجزای مسیر). مسیر طولانی‌تر ممکن است به فیبر، سوئیچ میانی یا طراحی دیگری نیاز داشته باشد؛ صرفاً تعویض سوکت محدودیت طول را برطرف نمی‌کند."],["Cat5e، Cat6 و نصب","رده کابل به‌تنهایی کیفیت نصب را تضمین نمی‌کند. خم شدید، کشش، له‌شدگی، نزدیکی به منابع تداخل و سربندی بد می‌توانند عملکرد را کاهش دهند. تستر مناسب و مستندسازی مسیر برای تحویل حرفه‌ای مهم‌اند."],["فیبر نوری","فیبر برای مسیرهای طولانی‌تر و جداسازی الکتریکی مفید است، اما به ماژول‌های سازگار، نوع فیبر مناسب، تمیزی کانکتور و رعایت شعاع خمش نیاز دارد. فیبر معمولاً برق PoE را منتقل نمی‌کند."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["مسیر جریان تصویر","در یک سامانه معمول، دوربین جریان را به شبکه می‌فرستد؛ سوئیچ آن را منتقل می‌کند و NVR/VMS دریافت و ضبط می‌کند. دسترسی از راه دور باید از مسیر امن و کنترل‌شده عبور کند؛ بازکردن مستقیم پورت دستگاه به اینترنت معمولاً انتخاب پرریسکی است."],["VPN و دسترسی راه دور","VPN تونلی رمزنگاری‌شده برای دسترسی به شبکه سازمانی فراهم می‌کند، اما به‌تنهایی امنیت کامل نیست. احراز هویت قوی، به‌روزرسانی، محدودسازی دسترسی و ثبت رویداد همچنان لازم‌اند."],["RTSP و HTTPS","RTSP در بسیاری از دوربین‌ها برای کنترل/دریافت جریان رسانه‌ای استفاده می‌شود و HTTPS برای ارتباط وب رمزنگاری‌شده است. پشتیبانی و پورت‌های واقعی باید در مستندات دستگاه بررسی شوند؛ از قراردادن گذرواژه در لینک‌های قابل انتشار پرهیز کنید."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["چک‌لیست نصب فیزیکی","قبل از سوراخ‌کاری، میدان دید و نقاط کور را روی نقشه بررسی کنید؛ سازه نصب، آب‌بندی، مسیر کابل، دسترسی سرویس، احتمال خرابکاری و قوانین حریم خصوصی را بسنجید."],["پذیرش پس از نصب","برای هر دوربین تصویر روز و شب، Focus، زمان، ضبط و بازپخش، قطع و وصل شبکه، دید در شرایط نور دشوار و هشدارهای دستکاری را ثبت کنید. تست را در شرایط واقعی محل انجام دهید."],["مستندسازی","به هر دوربین شناسه ثابت بدهید و آن را به محل، IP، سوئیچ/پورت، مدل، Firmware و کانال NVR مرتبط کنید. این جدول زمان عیب‌یابی و تغییرات آتی را کاهش می‌دهد."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["حداقل‌سازی سطح حمله","قابلیت‌های غیرضروری و حساب‌های پیش‌فرض را حذف یا غیرفعال کنید، Firmware را از منبع رسمی به‌روز نگه دارید و دسترسی مدیریتی را فقط به شبکه و افراد لازم محدود کنید."],["تفکیک شبکه","دوربین‌ها را در شبکه یا VLAN مجزا قرار دهید و قواعد Firewall/ACL را به حداقل ارتباط موردنیاز محدود کنید. جداسازی منطقی باید با کنترل مسیرهای بین شبکه‌ای همراه باشد."],["ثبت رویداد و زمان","لاگ ورود، تغییر تنظیمات، خطا و دسترسی راه دور را در حد پشتیبانی دستگاه فعال کنید و ساعت تجهیزات را با منبع زمان معتبر هماهنگ کنید. از لاگ‌ها و تنظیمات حساس با دسترسی کنترل‌شده نگهداری کنید."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["احتمال و پیامد","در ماتریس ریسک، احتمال وقوع و شدت پیامد را جدا ارزیابی کنید. امتیازهای عددی فقط ابزار اولویت‌بندی‌اند و باید با روش مصوب سازمان تفسیر شوند."],["ثبت مالک ریسک","برای هر ریسک مهم، مالک، کنترل موجود، اقدام اصلاحی، مسئول و موعد بازبینی مشخص کنید. پذیرش ریسک باید آگاهانه و طبق اختیار سازمان باشد."],["بازنگری ریسک","پس از تغییر شبکه، اضافه شدن دوربین، تغییر محل، حادثه یا آسیب‌پذیری تازه، ارزیابی ریسک را بازبینی کنید؛ ریسک ثابت و همیشگی فرض نمی‌شود."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["روش استانداردها","شماره نسخه و دامنه استاندارد را بررسی کنید؛ عنوان مشابه یا نام یک استاندارد به‌تنهایی ثابت نمی‌کند که کنترل مشخصی اجرا شده است. برای پروژه واقعی، نسخه معتبر و الزامات قراردادی/قانونی محل اجرا ملاک‌اند."],["کنترل انطباق","یک جدول تطبیق تهیه کنید: الزام، شاهد مورد انتظار، وضعیت فعلی، شکاف و اقدام اصلاحی. مستندات، تنظیمات واقعی و آزمون عملی باید با هم سازگار باشند."],["تفاوت راهنما و الزام","راهنمای فنی می‌تواند روش مناسب پیشنهاد دهد اما الزام‌آور بودن آن وابسته به قرارداد، مقررات یا سیاست سازمان است. درباره دامنه حقوقی بدون بررسی منبع معتبر ادعای قطعی نکنید."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["عیب‌یابی از ساده به پیچیده","ابتدا دامنه خرابی را تعیین کنید: یک دوربین، یک سوئیچ یا کل سایت. سپس برق و لینک، IP، مسیر شبکه، سرویس/مجوز، جریان تصویر و ضبط را مرحله‌ای بررسی کنید و هر تغییر را ثبت کنید."],["نشانه در برابر علت","خطای NVR ممکن است پیامد شبکه، مجوز، زمان، کدک یا ذخیره‌سازی باشد. قبل از تعویض قطعه، فرضیه را با آزمایش محدود و قابل تکرار بررسی کنید."],["آزمون پس از اصلاح","پس از رفع مشکل، فقط بازگشت تصویر زنده را بررسی نکنید؛ ضبط، بازپخش، زمان، هشدارها و عملکرد در ساعات پرترافیک یا شب را نیز تأیید کنید."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["ساختار پاسخ مصاحبه","پاسخ را با نیاز و محدودیت آغاز کنید، گزینه و دلیل انتخاب را بیان کنید، ریسک و راه کاهش آن را بگویید و در پایان روش آزمون و مستندسازی را توضیح دهید."],["سناریوهای چندعلتی","وقتی چند علامت هم‌زمان وجود دارد، از داده‌ها و شواهد شروع کنید و از فرض‌کردن یک علت قطعی بپرهیزید. زمان رویداد، لاگ، توپولوژی و تغییرات اخیر کمک‌کننده‌اند."],["ایمنی و حریم خصوصی","در طراحی دوربین، هدف مشروع، محدوده تصویربرداری، دسترسی به ضبط، مدت نگهداری و حفاظت از داده‌ها را لحاظ کنید و قوانین و سیاست‌های محل اجرا را رعایت کنید."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["موازنه هزینه و کیفیت","طراحی خوب بیشترین مگاپیکسل را برای همه نقاط انتخاب نمی‌کند؛ سطح جزئیات لازم برای هر هدف، هزینه ذخیره‌سازی، شبکه، نور و نگهداری را متعادل می‌کند."],["افزونگی و نقطه شکست","افزونگی باید نقاط شکست واقعی را پوشش دهد. دو منبع تغذیه متصل به یک برق بدون پشتیبان یا دو لینک در یک مسیر فیزیکی مشترک ممکن است افزونگی کامل ایجاد نکنند."],["بازبینی دوره‌ای","نقشه، فهرست کاربران، ظرفیت هارد، سلامت UPS، نسخه Firmware، زمان، Backup تنظیمات و کیفیت تصویر باید طبق برنامه بازبینی و نتیجه ثبت شود."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["تحلیل گزینه‌ها","در سؤال‌های چهارگزینه‌ای، ابتدا مفهوم مورد سنجش را پیدا کنید، گزینه‌های ناسازگار با تعریف را حذف کنید و سپس بین گزینه‌های نزدیک تفاوت دقیق را بسنجید."],["دام‌های رایج","RAID با Backup، Authentication با Authorization، Switch با Router و VLAN با Firewall یکی نیستند. سؤال‌ها معمولاً روی همین تفاوت‌های مفهومی تمرکز دارند."],["مرز منبع","این توضیحات برای یادگیری تکمیلی هستند؛ پاسخ‌های رسمی آزمون، سیاست سازمان و متن دقیق استاندارد باید با منبع اصلی و نسخه معتبر تطبیق داده شوند."]]},
{title:"توضیحات تکمیلی هوش مصنوعی",items:[["پاسخ سناریویی","برای هر سناریو، اول محدوده و اثر مشکل را مشخص کنید، سپس شواهد جمع کنید، احتمال‌ها را اولویت‌بندی کنید، تغییر کنترل‌شده انجام دهید و نتیجه را ثبت کنید."],["مستندسازی تصمیم","در مصاحبه توضیح دهید چرا یک گزینه را انتخاب کرده‌اید، چه ریسک باقیمانده‌ای وجود دارد و چطور نتیجه را می‌سنجید. پاسخ مطلق و بدون آزمون معمولاً ضعیف‌تر است."],["یادگیری پس از حادثه","پس از رفع حادثه، علت ریشه‌ای، زمان تشخیص، زمان بازیابی، اثر روی پوشش تصویری و اقدام پیشگیرانه را مرور کنید تا خطا تکرار نشود."]]}
];

// بانک تکمیلی پرسش‌ها؛ تعداد نهایی هر فصل دقیقاً ۲۵ سؤال خواهد بود.
function shortenOption(text){
  const clean=String(text||"").replace(/\s+/g," ").trim();
  if(clean.length<=145)return clean;
  const cut=clean.slice(0,142);
  const boundary=cut.lastIndexOf(" ");
  return (boundary>95?cut.slice(0,boundary):cut)+"…";
}
chapters.forEach((c,ci)=>{
  const concepts=[...c.sections.map(x=>({title:x[0],summary:x[1]})),...c.supplemental.items.map(x=>({title:x[0],summary:x[1]}))];
  let n=0;
  while(c.quiz.length<25){
    const concept=concepts[n%concepts.length];
    const others=concepts.filter(x=>x.title!==concept.title&&x.summary!==concept.summary);
    const distractors=[];
    for(let k=0;k<others.length&&distractors.length<3;k++){
      const candidate=others[(n*3+k+ci)%others.length];
      const option=shortenOption(candidate.summary);
      if(option!==shortenOption(concept.summary)&&!distractors.includes(option))distractors.push(option);
    }
    while(distractors.length<3)distractors.push(["این موضوع فقط به نام‌گذاری تجهیزات مربوط است.","این موضوع به‌تنهایی سلامت کل سامانه را تضمین می‌کند.","برای این موضوع نیازی به آزمون عملی نیست."][distractors.length]);
    const correct=shortenOption(concept.summary);
    const answerIndex=(n*7+ci)%4;
    const options=distractors.slice();
    options.splice(answerIndex,0,correct);
    c.quiz.push({
      q:"کدام گزاره درباره «"+concept.title+"» از نظر فنی درست‌تر است؟",
      o:options,
      a:answerIndex,
      e:"مفهوم اصلی: "+concept.summary+"\n\nدر عمل، این اصل را در شرایط واقعی پروژه بررسی کنید و نتیجه را با مشاهده، اندازه‌گیری یا مستندات معتبر تأیید کنید."
    });
    n++;
  }
});

}
function lessonHTML(){
const c=chapters[state.chapter];return `<div class="crumb"><button class="secondary" onclick="go('home')">داشبورد</button>　/　فصل ${state.chapter+1} از ${chapters.length}</div><article class="panel"><span class="pill">صفحات منبع: ${c.pages}</span><h1 class="lesson-title">${esc(c.title)}</h1><p class="lesson-intro">${esc(c.intro)}</p><div class="lesson-content">${c.sections.map(s=>`<h3>${esc(s[0])}</h3><p>${esc(s[1])}</p>`).join("")}<div class="callout"><b>نکته کاربردی:</b> ${esc(c.tips)}</div>${diagramHTML(c)}<section class="supplement"><h2>توضیحات تکمیلی و مثال‌های کاربردی</h2><p class="lesson-intro">این بخش توضیح تکمیلی بر پایه دانش فنی عمومی است و از محتوای مستقیم جزوه جدا شده است.</p>${c.supplemental.items.map((s,i)=>`<details class="supplement-item" ${i===0?"open":""}><summary>${esc(s[0])}</summary><p>${esc(s[1])}</p></details>`).join("")}</section></div><div class="lesson-actions"><button class="primary" onclick="go('chapterQuiz',${state.chapter})">شروع آزمون فصل ←</button><button class="secondary" onclick="markDone(${state.chapter})">${state.progress.done.includes(state.chapter)?"✓ فصل تکمیل شده":"علامت‌گذاری به‌عنوان مطالعه‌شده"}</button><button class="secondary" onclick="go('lesson',${Math.max(0,state.chapter-1)})" ${state.chapter===0?"disabled":""}>فصل قبلی</button><button class="secondary" onclick="go('lesson',${Math.min(chapters.length-1,state.chapter+1)})" ${state.chapter===chapters.length-1?"disabled":""}>فصل بعدی</button></div></article>`;
}
function explanationHTML(q){
  const answer=esc(q.o[q.a]);
  const detail=esc(q.e||"برای این سؤال هنوز توضیح تخصصی کافی ثبت نشده است؛ این مورد باید با منبع آموزشی تطبیق داده شود.");
  const distractorIndex=q.o.findIndex((_,i)=>i!==q.a);
  const distractor=esc(q.o[distractorIndex]||"یکی از گزینه‌های دیگر");
  return '<details class="answer-explanation"><summary>مشاهده پاسخ تشریحی و تمرین مفهومی</summary><div class="explanation-body"><p><b>پاسخ صحیح:</b> '+answer+'</p><p><b>مفهوم و دلیل پاسخ:</b></p><p>'+detail.replace(/\n/g,"<br>")+'</p><div class="practice-task"><p><b>تمرین همین سؤال:</b> فرض کن همکارت گزینه «'+distractor+'» را انتخاب کرده است. با زبان خودت توضیح بده چرا این گزینه پاسخ دقیق سؤال نیست و پاسخ «'+answer+'» چگونه به خواسته سؤال مربوط می‌شود.</p><label class="practice-label">پاسخت را قبل از دیدن راهنما بنویس:</label><textarea class="practice-input" rows="3" placeholder="دلیل خودت را بنویس…"></textarea><details class="practice-guide"><summary>راهنمای بررسی پاسخ من</summary><p>بررسی کن که آیا (۱) مفهوم اصلی را درست تعریف کرده‌ای، (۲) توضیح داده‌ای چرا پاسخ صحیح با صورت سؤال سازگار است، و (۳) روشن کرده‌ای چرا گزینه دیگر به مفهوم متفاوتی اشاره می‌کند یا سؤال را پاسخ نمی‌دهد.</p><p><b>نکته کلیدی:</b> '+detail.replace(/\n/g,"<br>")+'</p></details></div></div></details>';
}
function quizHTML(comprehensive=false){
const qs=comprehensive?allQuiz():chapters[state.chapter].quiz.map((q,qi)=>({...q,chapter:state.chapter,qi,tag:chapters[state.chapter].title}));
const title=comprehensive?"آزمون جامع دوره":"آزمون فصل: "+chapters[state.chapter].title;
let score=0;if(state.quizSubmitted)qs.forEach((q,i)=>{if(Number(state.quizAnswers[i])===q.a)score++});
return `<div class="crumb"><button class="secondary" onclick="go('home')">داشبورد</button>　/　آزمون</div><section class="panel"><span class="pill">${comprehensive?"آزمون همه فصل‌ها":"آزمون فصل"}</span><h1 class="lesson-title">${title}</h1><p class="lesson-intro">برای هر پرسش یک گزینه انتخاب کنید. پس از ثبت، پاسخ صحیح و توضیح نمایش داده می‌شود.</p><div id="questions">${qs.map((q,i)=>`<div class="quiz-question"><h3>${i+1}. ${esc(q.q)}</h3>${comprehensive?'<div class="muted" style="font-size:10px;margin-bottom:7px">فصل: '+esc(q.tag)+'</div>':""}${q.o.map((op,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${state.quizAnswers[i]===String(j)?"checked":""} ${state.quizSubmitted?"disabled":""} onchange="state.quizAnswers[${i}]=this.value"><span>${esc(op)}</span></label>`).join("")}${explanationHTML(q)}${state.quizSubmitted?`<div class="feedback ${Number(state.quizAnswers[i])===q.a?"good":"bad"}">${Number(state.quizAnswers[i])===q.a?"پاسخ درست است.":"پاسخ درست: "+esc(q.o[q.a])+"."} پس از مشاهده توضیح تشریحی، نکته‌های اصلی را مرور کنید.</div>`:""}</div>`).join("")}</div>
${state.quizSubmitted?`<div class="result"><h2 style="margin:0 0 5px">نتیجه: ${score} از ${qs.length}</h2><p style="margin:0;font-size:13px">درصد پاسخ درست: ${Math.round(score/qs.length*100)}٪</p><div class="progress" style="margin-top:12px;height:8px"><i style="width:${Math.round(score/qs.length*100)}%"></i></div></div>`:""}
<div class="quiz-toolbar">${state.quizSubmitted?'<button class="primary" onclick="retryQuiz()">تلاش دوباره</button>':'<button class="primary" onclick="submitQuiz('+comprehensive+')">ثبت پاسخ‌ها و مشاهده نتیجه</button>'}<button class="secondary" onclick="go('lesson',${state.chapter})">بازگشت به درس</button></div></section>`;
}
function savedHTML(){const list=chapters.map((c,i)=>({...c,i})).filter(c=>state.progress.done.includes(c.i));return `<div class="section-head"><div><h2>ادامه یادگیری</h2><p>فصل‌هایی که به‌عنوان مطالعه‌شده علامت زده‌اید.</p></div></div>${list.length?'<div class="course-grid">'+list.map(c=>`<button class="course" onclick="go('lesson',${c.i})"><div class="course-icon">✓</div><div class="course-body"><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><div class="course-foot"><span>تکمیل‌شده</span><div class="progress"><i style="width:100%"></i></div></div></div></button>`).join("")+'</div>':'<div class="panel empty">هنوز فصلی را تکمیل نکرده‌اید. از داشبورد یک فصل را باز کنید و پس از مطالعه آن را علامت بزنید.</div>'}<div class="lesson-actions"><button class="secondary" onclick="resetProgress()">پاک‌کردن پیشرفت ذخیره‌شده</button></div>`}
function wire(){document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{go(b.dataset.view);$("#sidebar").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");});}
function markDone(i){if(!state.progress.done.includes(i))state.progress.done.push(i);saveProgress();render()}
function submitQuiz(comprehensive){state.quizSubmitted=true;const qs=comprehensive?allQuiz():chapters[state.chapter].quiz.map(q=>q);if(!comprehensive){const score=qs.reduce((n,q,i)=>n+(Number(state.quizAnswers[i])===q.a?1:0),0);state.progress.scores[state.chapter]=score;if(score===qs.length&&!state.progress.done.includes(state.chapter))state.progress.done.push(state.chapter);saveProgress()}render()}
function retryQuiz(){state.quizAnswers={};state.quizSubmitted=false;render()}
function resetProgress(){if(confirm("پیشرفت ذخیره‌شده این دوره روی همین دستگاه پاک شود؟")){state.progress={done:[],scores:{}};saveProgress();render()}}
$("#searchInput").addEventListener("input",e=>{state.query=e.target.value;state.view="all";render()});
$("#menuBtn").setAttribute("aria-expanded","false");$("#menuBtn").addEventListener("click",()=>{const opened=$("#sidebar").classList.toggle("open");$("#menuBtn").setAttribute("aria-expanded",String(opened));});
render();
</script>
</body>
</html>
