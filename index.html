<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.85}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}

.main{min-width:0}.top{height:76px;padding:0 clamp(16px,3vw,38px);display:flex;align-items:center;gap:15px;border-bottom:1px solid var(--line);background:#ffffffd9;backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}.hamb{display:none}.search{position:relative;flex:1;max-width:550px}.search input{width:100%;border:1px solid var(--line);background:#f8f9fc;border-radius:12px;padding:11px 42px 11px 13px;color:var(--ink);font-size:13px}.search span{position:absolute;right:14px;top:7px;color:#8995a9}.top-right{margin-right:auto;color:var(--muted);font-size:12px;white-space:nowrap}.wrap{max-width:1250px;margin:auto;padding:30px clamp(16px,3vw,38px) 50px}.welcome{background:linear-gradient(115deg,#111b32,#273b6d 70%,#3e4fc4);border-radius:22px;padding:28px 30px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}.welcome:after{content:"";position:absolute;left:-40px;top:-100px;width:260px;height:260px;border:1px solid #ffffff25;border-radius:50%;box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff05}.eyebrow{font-size:11px;color:#c1c9ff;letter-spacing:.2px}.welcome h1{font-size:clamp(22px,3vw,32px);margin:8px 0 7px;line-height:1.5}.welcome p{color:#d1daef;font-size:13px;max-width:680px;margin:0 0 18px}.primary{border:0;background:var(--brand);color:white;border-radius:10px;padding:10px 16px;font-weight:bold;font-size:12px}.welcome .primary{background:#fff;color:#24315c;position:relative;z-index:1}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0 28px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:17px 19px;display:flex;align-items:center;gap:13px}.stat-icon{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:19px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:22px;line-height:1.3}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:24px 0 13px}.section-head h2{font-size:19px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:3px 0 0}.muted{color:var(--muted)}.course-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.course{padding:17px;display:flex;gap:14px;cursor:pointer;transition:.15s;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:right;color:inherit;width:100%;box-shadow:var(--shadow)}.course:hover{transform:translateY(-2px);border-color:#c3c9ff}.course-icon{flex-shrink:0;width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:#edf0ff;color:#4855d7;font-size:19px}.course-body{flex:1;min-width:0}.course h3{margin:0 0 4px;font-size:14px}.course p{margin:0;color:var(--muted);font-size:11px}.course-foot{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:10px;color:var(--muted)}.progress{height:5px;border-radius:99px;background:#edf0f5;overflow:hidden;flex:1}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--teal));border-radius:99px}.pill{font-size:10px;padding:3px 8px;border-radius:99px;background:#edf0ff;color:#4c55c7;white-space:nowrap}
.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,30px);box-shadow:var(--shadow)}.crumb{color:var(--muted);font-size:12px;margin-bottom:12px}.lesson-title{font-size:clamp(22px,3vw,29px);margin:0 0 8px;line-height:1.5}.lesson-intro{color:var(--muted);font-size:13px;margin:0 0 22px}.lesson-content h3{font-size:16px;margin:24px 0 7px}.lesson-content p{margin:7px 0;font-size:14px}.lesson-content ul{padding-right:23px;font-size:13px}.lesson-content li{margin:5px 0}.callout{background:#f0fdfa;border-right:3px solid var(--teal);padding:12px 15px;border-radius:8px;margin:18px 0;font-size:13px}.lesson-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}.secondary{border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:9px 14px;font-size:12px}.secondary:disabled{opacity:.4;cursor:not-allowed}
.quiz-question{border:1px solid var(--line);border-radius:14px;padding:17px;margin:14px 0}.quiz-question h3{font-size:14px;margin:0 0 12px}.option{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:7px 0;font-size:12px;cursor:pointer}.option:has(input:checked){border-color:#818cf8;background:#f4f4ff}.option input{margin-top:5px;accent-color:var(--brand)}.feedback{font-size:12px;padding:10px 12px;border-radius:9px;margin-top:10px}.feedback.good{background:#e6fcf5;color:#087f5b}.feedback.bad{background:#fff0f0;color:#c92a2a}.quiz-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}.result{padding:22px;background:#f6f7ff;border-radius:14px;margin-top:18px}.empty{padding:35px;text-align:center;color:var(--muted)}.footer{font-size:10px;color:#8b95a7;text-align:center;padding:28px 0 0}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:20;inset:0 0 0 auto;width:min(300px,85vw);transform:translateX(105%);transition:transform .2s;box-shadow:-15px 0 40px #0002}.side.open{transform:translateX(0)}.hamb{display:inline-flex;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px}.course-grid{grid-template-columns:1fr}.top-right{display:none}.top{height:66px}.stats{gap:8px}.stat{padding:12px;gap:8px}.stat-icon{width:35px;height:35px}.stat strong{font-size:19px}.stat small{font-size:10px}.welcome{padding:23px 20px}}
@media(max-width:420px){.stats{grid-template-columns:1fr}.stat{padding:10px 14px}.stat-icon{width:37px;height:37px}.wrap{padding-top:20px}.welcome h1{font-size:23px}}

<script>
const chapters = [
{title:"مبانی شبکه",pages:"۱–۴",icon:"⌘",desc:"مفاهیم پایه شبکه و ارتباط دوربین‌های IP",intro:"پیش‌نیاز درک طراحی، نصب و عیب‌یابی سامانه‌های نظارت تصویری تحت شبکه.",sections:[
["مفاهیم پایه","شبکه مجموعه‌ای از دستگاه‌هاست که برای تبادل داده به هم متصل‌اند. در سامانه IP CCTV، دوربین، سوئیچ، NVR/VMS و ایستگاه مشاهده از طریق شبکه با یکدیگر ارتباط دارند."],
["آدرس‌دهی و سرویس‌ها","IP برای شناسایی منطقی دستگاه در شبکه استفاده می‌شود. Subnet مشخص می‌کند کدام آدرس‌ها در یک شبکه محلی قرار دارند. DHCP می‌تواند آدرس را به‌صورت خودکار تخصیص دهد و DNS نام دامنه را به آدرس IP تبدیل می‌کند."],
["ارتباط و جداسازی","Switch دستگاه‌های یک شبکه محلی را به هم متصل می‌کند؛ Router شبکه‌های متفاوت را مسیریابی می‌کند. VLAN جداسازی منطقی ایجاد می‌کند، اما به‌تنهایی جایگزین Firewall و ACL نیست."],
["پروتکل‌ها و زمان","Ping برای بررسی دسترس‌پذیری IP کمک می‌کند، ولی پاسخ‌دادن آن سلامت همه سرویس‌های تصویر را تضمین نمی‌کند. NTP برای هماهنگ‌سازی زمان دوربین‌ها، NVR و Logها اهمیت دارد."]],tips:"برای عیب‌یابی، از لایه‌های ساده‌تر مثل برق و لینک فیزیکی شروع کنید و بعد به IP، مسیریابی و سرویس تصویر برسید.",quiz:[
{q:"کدام سرویس معمولاً آدرس IP را به‌صورت خودکار اختصاص می‌دهد؟",o:["DNS","DHCP","NTP","H.265"],a:1,e:"DHCP برای تخصیص خودکار تنظیمات آدرس‌دهی شبکه به کار می‌رود."},
{q:"VLAN به‌تنهایی چه چیزی را تضمین نمی‌کند؟",o:["جداسازی منطقی","امنیت کامل بین شبکه‌ها","تقسیم دامنه‌های شبکه","سازمان‌دهی شبکه"],a:1,e:"برای کنترل ارتباط بین VLANها ممکن است Firewall و ACL لازم باشد."}]},
{title:"مبانی فنی CCTV",pages:"۴–۱۵",icon:"◉",desc:"انواع دوربین، تصویر، لنز و ویژگی‌های تصویربرداری",intro:"کیفیت نظارت فقط به عدد مگاپیکسل وابسته نیست؛ لنز، نور، زاویه و فشرده‌سازی نیز اثر دارند.",sections:[
["آنالوگ و IP","دوربین آنالوگ تصویر را در بستر سامانه آنالوگ منتقل می‌کند؛ دوربین IP داده ویدئویی را از طریق شبکه می‌فرستد و معمولاً تنظیمات و مدیریت شبکه‌ای دارد."],
["رزولوشن، FPS و Bitrate","Resolution تعداد پیکسل‌های تصویر را توصیف می‌کند. FPS تعداد فریم در ثانیه است. Bitrate میزان داده ویدئو در واحد زمان است و بر پهنای باند و فضای ذخیره‌سازی اثر می‌گذارد."],
["فشرده‌سازی و نرخ بیت","H.264 و H.265 کدک‌های فشرده‌سازی ویدئو هستند. کاهش Bitrate می‌تواند مصرف شبکه و ذخیره‌سازی را کم کند، اما در صورت تنظیم نامناسب جزئیات تصویر افت می‌کند. VBR نرخ بیت را متناسب با پیچیدگی صحنه تغییر می‌دهد."],
["لنز و نور","فاصله کانونی لنز، زاویه دید و جزئیات قابل مشاهده را تحت تأثیر قرار می‌دهد. Focus، نور محیط، Exposure و Motion Blur در وضوح نهایی نقش دارند."],
["ویژگی‌های تصویر","WDR برای صحنه‌هایی با اختلاف زیاد روشنایی مفید است؛ HLC برای مهار منابع نور شدید مانند چراغ خودرو کاربرد دارد. ICR فیلتر مرتبط با مادون قرمز است و IR برای تصویربرداری در تاریکی به کار می‌رود. انعکاس IR از شیشه یا سطوح نزدیک می‌تواند تصویر شب را خراب کند."]],tips:"برای شناسایی چهره یا پلاک، قبل از افزایش مگاپیکسل، هدف، فاصله، زاویه، لنز، نور و Pixel Density را بررسی کنید.",quiz:[
{q:"WDR در چه شرایطی اهمیت بیشتری دارد؟",o:["اختلاف شدید روشنایی در یک صحنه","افزایش ظرفیت HDD","تخصیص IP","جلوگیری از Loop"],a:0,e:"WDR به مدیریت صحنه‌هایی با نواحی خیلی روشن و خیلی تاریک کمک می‌کند."},
{q:"H.265 به چه چیزی مربوط است؟",o:["رمزنگاری شبکه","فشرده‌سازی ویدئو","کنترل دسترسی فیزیکی","هماهنگ‌سازی زمان"],a:1,e:"H.265 کدک فشرده‌سازی ویدئو است."}]},
{title:"طراحی و زیرساخت CCTV",pages:"۱۵–۲۹",icon:"▦",desc:"طراحی پوشش، شبکه، پهنای باند و ذخیره‌سازی",intro:"طراحی حرفه‌ای از نیاز امنیتی آغاز می‌شود و تا آزمایش، مستندسازی و نگهداری ادامه دارد.",sections:[
["نیازسنجی و پوشش","نقاط حساس، ورودی و خروجی، نقاط کور، نور، فاصله و هدف تصویر را مشخص کنید. اهداف می‌توانند Detection، Recognition یا Identification باشند و به سطح جزئیات متفاوت نیاز دارند."],
["شبکه و کابل‌کشی","تعداد دوربین‌ها، Bitrate هر دوربین، Uplink، ظرفیت سوئیچ، VLAN و مسیر کابل باید با هم بررسی شوند. چراغ Link خاموش معمولاً بررسی کابل، سوکت، Patch Panel، پورت سوئیچ، پورت دوربین و برق را ایجاب می‌کند."],
["پهنای باند","بار تقریبی شبکه از مجموع جریان‌های ویدئویی و ترافیک جانبی اثر می‌گیرد. ظرفیت واقعی باید با توجه به Bitrate، تعداد دوربین‌ها، ضبط، مشاهده زنده و سربار شبکه محاسبه و آزمایش شود."],
["ذخیره‌سازی و ضبط","ظرفیت Storage به تعداد دوربین‌ها، Bitrate، مدت نگهداری، ساعات ضبط و سیاست ضبط بستگی دارد. باید ظرفیت ورودی NVR، تعداد کانال‌ها، Codec و توان پردازشی نیز بررسی شود."],
["RAID، برق و پایداری","RAID می‌تواند تحمل خرابی دیسک یا دسترس‌پذیری را بهبود دهد، اما Backup نیست. UPS برای پشتیبانی برق تجهیزات حیاتی است؛ افزونگی و برنامه بازیابی باید متناسب با اهمیت محل طراحی شوند."]],tips:"صرف روشن‌شدن تصویر پایان کار نیست؛ Live، ضبط، Playback، شب/روز، ذخیره‌سازی، زمان و دسترسی کاربران را آزمایش کنید.",quiz:[
{q:"کدام مورد جایگزین Backup محسوب نمی‌شود؟",o:["نسخه پشتیبان جداگانه","آزمون بازیابی","RAID","نگهداری نسخه آفلاین"],a:2,e:"RAID و Backup اهداف متفاوتی دارند؛ RAID به‌تنهایی حذف یا رمزگذاری مخرب داده را پوشش نمی‌دهد."},
{q:"هنگام طراحی ظرفیت ذخیره‌سازی کدام عامل مهم است؟",o:["فقط رنگ دوربین","تعداد دوربین، Bitrate و مدت نگهداری","فقط نام شبکه","فقط نوع مانیتور"],a:1,e:"این عوامل مستقیماً بر حجم داده و ظرفیت موردنیاز اثر می‌گذارند."}]},
{title:"امنیت فیزیکی و محیطی",pages:"۲۹–۳۳",icon:"⬡",desc:"محافظت از دوربین، رک، تجهیزات و محل نصب",intro:"کنترل‌های فیزیکی باید مانع دست‌کاری تجهیزات شوند و از محیط و زیرساخت محافظت کنند.",sections:[
["موقعیت نصب","ارتفاع، زاویه، دسترسی افراد، امکان جابه‌جایی و پوشش نقاط حساس را ارزیابی کنید. محل نصب نامناسب ممکن است به نقطه کور یا آسیب‌پذیری فیزیکی منجر شود."],
["حفاظت محیطی","در انتخاب تجهیزات به شرایط محیطی، گردوغبار، رطوبت، دما و احتمال ضربه توجه کنید. کد IP برای حفاظت در برابر نفوذ جامدات و آب و کد IK برای مقاومت در برابر ضربه مکانیکی به کار می‌رود."],
["کشف دست‌کاری","Tamper Detection، پایش وضعیت و استفاده از دوربین مکمل در نقاط حساس می‌توانند به کشف جابه‌جایی یا ازکارافتادن کمک کنند. کنترل دسترسی به اتاق تجهیزات و رک نیز مهم است."],
["زیرساخت حیاتی","رک، NVR، سوئیچ و منبع تغذیه باید در محل کنترل‌شده قرار گیرند. مسیر کابل و برق اضطراری نیز بخشی از طراحی فیزیکی است."]],tips:"عدد IP و IK را با نیاز واقعی محل تطبیق دهید؛ به‌جای فرض‌کردن حفاظت مطلق، شرایط نصب و دستورالعمل سازنده را بررسی کنید.",quiz:[
{q:"کد IK عمدتاً به چه چیزی مربوط است؟",o:["فشرده‌سازی تصویر","مقاومت در برابر ضربه مکانیکی","آدرس‌دهی IP","ذخیره‌سازی ویدئو"],a:1,e:"IK برای طبقه‌بندی مقاومت در برابر ضربه مکانیکی استفاده می‌شود."},

{title:"امنیت سایبری دوربین‌های IP",pages:"۳۳–۳۵",icon:"⌑",desc:"حساب‌ها، به‌روزرسانی، جداسازی شبکه و دسترسی راه دور",intro:"سامانه CCTV خود یک دارایی شبکه‌ای است و باید با کنترل‌های چندلایه محافظت شود.",sections:[

["شبکه امن","دوربین‌ها را در صورت نیاز از شبکه‌های دیگر جدا کنید و ارتباطات را با Firewall و ACL کنترل کنید. VLAN به‌تنهایی امنیت کامل ایجاد نمی‌کند."],
["Firmware و سرویس‌ها","Firmware را طبق فرایند امن و سازگار با سازنده به‌روز نگه دارید؛ سرویس‌ها و پورت‌های غیرضروری را غیرفعال کنید و تنظیمات امن را مستند سازید."],
["دسترسی از راه دور","از قراردادن مستقیم رابط مدیریتی دوربین یا NVR روی اینترنت اجتناب کنید. دسترسی راه دور باید کنترل‌شده باشد؛ در جزوه VPN در مقایسه با Port Forwarding به‌عنوان گزینه امن‌تر مطرح شده است."],

{title:"پشتیبان‌گیری و بازیابی بحران",pages:"۳۵–۳۶",icon:"↻",desc:"Backup، Disaster Recovery، RPO و RTO",intro:"جزوه این بخش را با عنوان «Backup و Disaster Recovery» معرفی می‌کند.",sections:[
["Backup","نسخه‌ای از اطلاعات یا تنظیمات برای بازیابی در صورت خرابی، حذف اشتباه، حمله یا حادثه است. داشتن Backup به‌تنهایی کافی نیست؛ بازیابی باید آزمایش شود."],

["RPO و RTO","RPO حداکثر میزان قابل قبول از دست رفتن داده از نظر زمانی است؛ RTO هدف زمانی برای بازیابی سرویس است. در مثال جزوه، RPO یک ساعت و RTO دو ساعت بیان شده‌اند."],
["روش نگهداری نسخه","Backup باید منظم باشد، بازیابی آن آزمایش شود، در محل مناسب نگهداری و در برابر دسترسی غیرمجاز محافظت شود. نگهداری Offline یا جدا از سامانه اصلی در صورت نیاز، ریسک رخداد مشترک را کاهش می‌دهد."]],tips:"RPO درباره داده قابل‌از‌دست‌رفتن است؛ RTO درباره زمان هدف بازیابی سرویس. این دو را با هم اشتباه نگیرید.",quiz:[

{title:"مدیریت ریسک",pages:"۳۶–۳۷",icon:"◇",desc:"دارایی، تهدید، آسیب‌پذیری و درمان ریسک",intro:"مدیریت ریسک کمک می‌کند کنترل‌ها بر اساس دارایی‌ها، تهدیدها و پیامدهای واقعی انتخاب شوند.",sections:[

["ارزیابی ریسک","Risk Assessment شامل شناسایی دارایی‌ها، تهدیدها، آسیب‌پذیری‌ها و ارزیابی ریسک‌های مربوط به آن‌هاست. مثال جزوه: دوربین ورودی دارایی است؛ خرابکاری تهدید و نصب در ارتفاع پایین آسیب‌پذیری است."],
["درمان ریسک","روش‌های متداول شامل کاهش، اجتناب، انتقال و پذیرش ریسک است. انتخاب روش باید متناسب با پیامد و شرایط سازمان باشد."],

{title:"استانداردها و چارچوب‌ها",pages:"۳۷–۳۸",icon:"▧",desc:"ISO، TIA-942، Tier و راهنماهای NIST",intro:"جزوه میان استاندارد، الزام قانونی یا قراردادی و راهنمای مرجع تمایز می‌گذارد.",sections:[
["استاندارد و الزام","استاندارد مجموعه الزامات یا قواعد پذیرفته‌شده است. همه استانداردها الزام قانونی نیستند؛ الزام می‌تواند از قانون، قرارداد، سازمان یا انتخاب داوطلبانه ناشی شود."],
["استانداردهای امنیت و تداوم","ISO/IEC 27001 درباره الزامات سیستم مدیریت امنیت اطلاعات است؛ ISO/IEC 27002 راهنمای کنترل‌های امنیت اطلاعات؛ ISO 22301 درباره مدیریت تداوم کسب‌وکار و ISO 31000 درباره مدیریت ریسک است."],
["مراکز داده","TIA-942 به زیرساخت مراکز داده، مانند ساختمان، برق، سرمایش، کابل‌کشی و امنیت فیزیکی می‌پردازد. ISO/IEC 22237 نیز مجموعه‌ای از استانداردها در حوزه امکانات و زیرساخت مراکز داده است."],
["Tier و NIST","در مدل شناخته‌شده Uptime Institute، Tier I تا Tier IV سطوحی برای قابلیت اطمینان و افزونگی زیرساخت مراکز داده‌اند؛ این مفهوم فقط مخصوص CCTV نیست. NIST راهنماها و چارچوب‌های فناوری و امنیت سایبری منتشر می‌کند و خودبه‌خود قانون ایران محسوب نمی‌شود."]],tips:"هنگام پاسخ به پرسش استانداردها، موضوع استاندارد را دقیق بگویید و الزام‌آور بودن را به قانون، قرارداد یا چارچوب مربوط وابسته بدانید.",quiz:[

{title:"عیب‌یابی حرفه‌ای CCTV",pages:"۳۸–۴۰",icon:"⌕",desc:"عیب‌یابی مرحله‌ای قطع تصویر، تأخیر و مشکلات ضبط",intro:"به‌جای حدس‌زدن یا بررسی تصادفی، از نشانه‌ها برای محدودکردن محل مشکل استفاده کنید.",sections:[

["Ping هست ولی تصویر نیست","پورت و سرویس، نام کاربری و رمز، ONVIF، Stream، Codec، NVR/VMS، Firewall و پهنای باند را بررسی کنید."],
["تصویر تکه‌تکه یا با تأخیر","Packet Loss، Bandwidth، ازدحام شبکه، CPU، Storage، کابل، تنظیمات Encoding و بار پردازشی را بررسی کنید."],
["مشکلات شب و ضبط","در تصویر خراب شبانه، IR، Smart IR، Exposure، WDR، بازتاب IR، شیشه، تمیزی لنز، برق و دما را بررسی کنید. برای ضبط‌نشدن، Storage، HDD، برنامه ضبط، سیاست ضبط و مجوزها را بررسی کنید."]],tips:"اگر چند دوربین هم‌زمان قطع شوند، ابتدا زیرساخت مشترک مثل برق، PoE Switch، Uplink و شبکه اصلی را بررسی کنید؛ اگر فقط یک دوربین قطع است، مسیر اختصاصی آن محتمل‌تر است.",quiz:[

{title:"سناریوهای آزمون و مصاحبه",pages:"۴۰–۴۱",icon:"▣",desc:"حل مسئله‌های عملی طراحی و نگهداری",intro:"پاسخ حرفه‌ای باید روند بررسی و دلیل انتخاب کنترل را بیان کند، نه فقط نام یک تجهیز را.",sections:[

["دسترسی غیرمجاز یا کارکنان سابق","برای اتصال بیرونی به NVR، قرارگرفتن مستقیم روی اینترنت، Firewall، Port Forwarding، VPN، حساب‌ها، رمز، MFA و Log را بررسی کنید. پس از خروج کارمند، حساب‌ها و مجوزهای فیزیکی و شبکه‌ای بازبینی شوند."],

{title:"مفاهیم سخت و پرسش‌های تحلیلی",pages:"۴۱–۴۲",icon:"∴",desc:"دلیل انتخاب کنترل‌ها و تفاوت مفاهیم نزدیک",intro:"این بخش برای تمرین توضیح چرایی تصمیم‌های طراحی و امنیتی است.",sections:[

{q:"چرا Password قوی به‌تنهایی کافی نیست؟",o:["چون امنیت فقط به تصویر وابسته است","چون Firmware آسیب‌پذیر، سرویس باز یا دسترسی فیزیکی نیز ممکن است راه حمله باشد","چون رمزها هیچ اثری ندارند","چون NTP جای رمز را می‌گیرد"],a:1,e:"امنیت باید چندلایه باشد و به یک کنترل محدود نشود."},
{q:"چرا NTP در سامانه CCTV اهمیت دارد؟",o:["برای همگام‌سازی زمان رویدادها و Logها","برای افزایش FPS","برای فرمت HDD","برای تنظیم زاویه لنز"],a:0,e:"زمان صحیح به تطبیق رویدادها و بررسی امنیتی کمک می‌کند."}]},
{title:"چک‌لیست نهایی طراحی",pages:"۴۲–۴۳",icon:"☑",desc:"بازبینی پیش از اجرا، تست نصب و مدارک تحویل",intro:"چک‌لیست‌ها کمک می‌کنند موارد حیاتی در طراحی یا تحویل از قلم نیفتند.",sections:[
["پیش از اجرا","هدف امنیتی، نقشه محل، نقاط حساس و کور، نور، فاصله، زاویه، ارتفاع، نوع دوربین و لنز، Resolution، FPS، Bitrate، Codec، Storage، Network، Switch، PoE، UPS، Backup، امنیت فیزیکی و سایبری، NTP، Logging و مستندسازی را بررسی کنید."],
["پس از نصب","Live، Recording، Playback، Resolution، Focus، Day/Night، IR، WDR، Motion، Audio در صورت نیاز، PTZ در صورت وجود، Network، PoE، Storage، Time، User Access و Tamper را آزمایش کنید."],
["مدارک تحویل","نقشه دوربین‌ها، IP و MAC، نقشه شبکه، Switch Port، تنظیمات NVR، فهرست تجهیزات، ضمانت، نسخه Firmware، Configuration Backup، مستندات کابل‌کشی و دستورالعمل بهره‌برداری و نگهداری را ثبت کنید."],
["پشتیبان تنظیمات","Configuration Backup می‌تواند هنگام خرابی NVR، سوئیچ یا تجهیز دیگر، بازیابی را سریع‌تر کند. نسخه و محل نگهداری آن باید کنترل‌شده و قابل بازیابی باشد."]],tips:"تحویل حرفه‌ای فقط تحویل تصویر زنده نیست؛ آزمون‌های ثبت‌شده و مدارک قابل استفاده برای نگهداری نیز لازم‌اند.",quiz:[
{q:"کدام مورد از مدارک تحویل مناسب است؟",o:["فقط عکس مانیتور","نقشه دوربین‌ها، IPها و تنظیمات NVR","فقط رمز مشترک","هیچ مستندی لازم نیست"],a:1,e:"جزوه بر نقشه‌ها، فهرست آدرس‌ها، تنظیمات و مدارک کابل‌کشی تأکید می‌کند."},
{q:"چرا Configuration Backup مهم است؟",o:["برای بازیابی سریع‌تر تنظیمات پس از خرابی","برای افزایش نور IR","برای حذف کنترل دسترسی","برای افزایش طول کابل"],a:0,e:"نسخه تنظیمات می‌تواند فرآیند بازگردانی تجهیزات را سریع‌تر کند."}]},
{title:"سؤالات چهارگزینه‌ای جزوه",pages:"۴۳–۴۴",icon:"☷",desc:"تمرین سؤال‌های موجود در منبع اصلی",intro:"سؤالات زیر از بخش چهارگزینه‌ای جزوه بازنویسی ساختاری شده‌اند؛ پاسخ صحیح مطابق کلید درج‌شده در PDF است.",sections:[
["راهنمای تمرین","ابتدا پاسخ خود را انتخاب کنید و سپس نتیجه و توضیح را ببینید. این بخش روی مفاهیم شبکه، استانداردها، تصویربرداری، ذخیره‌سازی و امنیت تمرکز دارد."],
["توجه به منبع","جزوه در این بخش سؤال‌های شماره ۱۴۵ تا ۱۶۰ را درج کرده است. این اپ نسخه آموزشی قابل توسعه است و ادعا نمی‌کند تمام صفحات PDF به‌صورت کلمه‌به‌کلمه بازتولید شده‌اند."]],tips:"برای مرور مؤثر، پس از پاسخ اشتباه به درس مرتبط برگردید و دلیل گزینه درست را با مفهوم آن تطبیق دهید.",quiz:[
{q:"کدام گزینه برای شناسایی کاربر مناسب‌تر است؟",o:["Authorization","Authentication","VLAN","RAID"],a:1,e:"پاسخ کلید جزوه: Authentication."},
{q:"کدام گزینه برای تعیین سطح دسترسی کاربر است؟",o:["Authentication","Authorization","DNS","DHCP"],a:1,e:"پاسخ کلید جزوه: Authorization."},
{q:"کدام گزینه جایگزین Backup نیست؟",o:["NAS","Backup","RAID","Storage"],a:2,e:"پاسخ کلید جزوه: RAID."},
{q:"کدام استاندارد در جزوه مربوط به مراکز داده معرفی شده است؟",o:["TIA-942","H.265","IEEE 802.3af","HTTP"],a:0,e:"پاسخ کلید جزوه: TIA-942."},
{q:"کدام مورد مربوط به PoE است؟",o:["IEEE 802.3af","IEEE 802.11 فقط","H.264","SHA-256"],a:0,e:"پاسخ کلید جزوه: IEEE 802.3af."},
{q:"کدام مورد برای جلوگیری از Loop شبکه کاربرد دارد؟",o:["STP","WDR","HLC","H.265"],a:0,e:"پاسخ کلید جزوه: STP."}]},
{title:"سؤالات مصاحبه فنی",pages:"۴۴–۴۵",icon:"☏",desc:"تمرین پاسخ ساختاریافته به پرسش‌های مصاحبه",intro:"این فصل از پرسش‌های مصاحبه و سناریوهای انتهایی جزوه الهام گرفته شده است.",sections:[
["طراحی سامانه امن","پاسخ را با نیاز امنیتی و ریسک آغاز کنید؛ نقاط حساس و هدف هر دوربین را تعیین کنید؛ سپس دوربین، لنز، نور، شبکه، ذخیره‌سازی و برق را طراحی کنید. کنترل‌های امنیتی مانند Segmentation، Firewall، ACL، Authentication، Least Privilege، Firmware Update، Logging و دسترسی امن راه دور را هم توضیح دهید."],
["عیب‌یابی و حادثه","برای قطع همه دوربین‌ها ابتدا برق و زیرساخت مشترک را بررسی کنید؛ برای یک دوربین، مسیر اختصاصی را دنبال کنید. در رخداد نفوذ، دسترسی را کنترل و Incident Response را طبق رویه سازمان اجرا کنید و پیش از بازگرداندن سیستم، شواهد و تغییرات را مستند کنید."],
["پاسخ روشن و مستدل","برای هر پاسخ سه بخش داشته باشید: تصمیم، دلیل، و روش راستی‌آزمایی. از ادعاهای مطلق مثل «یک تنظیم همه مشکلات را حل می‌کند» اجتناب کنید."]],tips:"در پاسخ مصاحبه، روند منطقی و اولویت‌بندی مهم است؛ پس از اقدام اصلاحی، عملکرد را آزمایش و نتیجه را مستند کنید.",quiz:[
{q:"اگر NVR هک شده باشد، رویکرد مناسب چیست؟",o:["بازگرداندن فوری بدون بررسی","کنترل/ایزوله‌کردن دسترسی، اجرای رویه پاسخ به حادثه و بررسی Logها","حذف همه شواهد","غیرفعال‌کردن همه مستندات"],a:1,e:"جزوه بر Incident Response، بررسی Log و مستندسازی پیش از بازگردانی تأکید دارد."},
{q:"ویژگی مهم کارشناس حرفه‌ای در جزوه چیست؟",o:["فقط تصویر زنده را بررسی می‌کند","کل چرخه نیازسنجی، طراحی، امنیت، آزمایش، مستندسازی و نگهداری را می‌بیند","فقط مگاپیکسل را افزایش می‌دهد","همه دوربین‌ها را مستقیم به اینترنت وصل می‌کند"],a:1,e:"جزوه نگاه Lifecycle به سامانه را از ویژگی‌های کارشناس حرفه‌ای می‌داند."}]}
];
const icons=["⌘","◉","▦","⬡","⌑","↻","◇","▧","⌕","▣","∴","☑","☷","☏"];
const $=s=>document.querySelector(s);
const storeKey="cctvAcademyProgressV1";
let state={view:"home",chapter:0,quizAnswers:{},quizSubmitted:false,query:"",progress:loadProgress()};
function loadProgress(){try{return JSON.parse(localStorage.getItem(storeKey))||{done:[],scores:{}}}catch(e){return{done:[],scores:{}}}}
function saveProgress(){try{localStorage.setItem(storeKey,JSON.stringify(state.progress))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pct(i){return state.progress.done.includes(i)?100:0}
function totalQuestions(){return chapters.reduce((n,c)=>n+c.quiz.length,0)}
function allQuiz(){return chapters.flatMap((c,ci)=>c.quiz.map((q,qi)=>({...q,chapter:ci,qi,tag:c.title})))}
function go(view,idx){state.view=view;if(idx!==undefined)state.chapter=idx;state.quizAnswers={};state.quizSubmitted=false;render();$("#sidebar").classList.remove("open");window.scrollTo({top:0,behavior:"smooth"})}
function render(){const root=$("#view");if(state.view==="lesson")root.innerHTML=lessonHTML();else if(state.view==="chapterQuiz")root.innerHTML=quizHTML(false);else if(state.view==="quiz")root.innerHTML=quizHTML(true);else if(state.view==="saved")root.innerHTML=savedHTML();else root.innerHTML=homeHTML(state.view==="all");wire()}
function homeHTML(showAll=false){
const done=state.progress.done.length, percent=Math.round(done/chapters.length*100);
const filtered=chapters.map((c,i)=>({...c,i})).filter(c=>!state.query||[c.title,c.desc,c.intro,c.sections.map(s=>s.join(" ")).join(" ")].join(" ").toLowerCase().includes(state.query.toLowerCase()));
return `<section class="welcome"><div class="eyebrow">مسیر یادگیری • شبکه، CCTV و امنیت</div><h1>مهارتت را از مبانی تا طراحی و عیب‌یابی بساز</h1><p>دوره‌ای ساختاریافته بر پایه جزوه آمادگی آزمون و مصاحبه افتا، با درس‌های خلاصه، آزمون فصل‌به‌فصل و ذخیره پیشرفت روی همین دستگاه.</p><button class="primary" onclick="go('lesson',${state.progress.done.length<chapters.length?chapters.findIndex((c,i)=>!state.progress.done.includes(i)):0})">ادامه یادگیری ←</button></section>
<div class="stats"><div class="stat"><div class="stat-icon">▤</div><div><small>فصل‌های دوره</small><strong>${chapters.length}</strong></div></div><div class="stat"><div class="stat-icon">✓</div><div><small>فصل‌های تکمیل‌شده</small><strong>${done}</strong></div></div><div class="stat"><div class="stat-icon">◷</div><div><small>پیشرفت دوره</small><strong>${percent}٪</strong></div></div></div>
<div class="section-head"><div><h2>${showAll?"فهرست همه فصل‌ها":"مسیر آموزشی"}</h2><p>هر فصل شامل درس خلاصه و آزمون مخصوص همان فصل است.</p></div><span class="pill">${filtered.length} فصل</span></div>
<div class="course-grid">${filtered.map(c=>`<button class="course" onclick="go('lesson',${c.i})"><div class="course-icon">${c.icon}</div><div class="course-body"><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><div class="course-foot"><span>صفحات ${c.pages}</span><div class="progress"><i style="width:${pct(c.i)}%"></i></div><span>${pct(c.i)?"تکمیل":"شروع درس"}</span></div></div></button>`).join("")||'<div class="empty">فصلی با این عبارت پیدا نشد.</div>'}</div>
<div class="footer">محتوا خلاصه‌سازی آموزشی از PDF پیوست است. پیشرفت فقط در حافظه محلی همین مرورگر ذخیره می‌شود.</div>`;
}
function lessonHTML(){
const c=chapters[state.chapter];return `<div class="crumb"><button class="secondary" onclick="go('home')">داشبورد</button>　/　فصل ${state.chapter+1} از ${chapters.length}</div><article class="panel"><span class="pill">صفحات منبع: ${c.pages}</span><h1 class="lesson-title">${esc(c.title)}</h1><p class="lesson-intro">${esc(c.intro)}</p><div class="lesson-content">${c.sections.map(s=>`<h3>${esc(s[0])}</h3><p>${esc(s[1])}</p>`).join("")}<div class="callout"><b>نکته کاربردی:</b> ${esc(c.tips)}</div></div><div class="lesson-actions"><button class="primary" onclick="go('chapterQuiz',${state.chapter})">شروع آزمون فصل ←</button><button class="secondary" onclick="markDone(${state.chapter})">${state.progress.done.includes(state.chapter)?"✓ فصل تکمیل شده":"علامت‌گذاری به‌عنوان مطالعه‌شده"}</button><button class="secondary" onclick="go('lesson',${Math.max(0,state.chapter-1)})" ${state.chapter===0?"disabled":""}>فصل قبلی</button><button class="secondary" onclick="go('lesson',${Math.min(chapters.length-1,state.chapter+1)})" ${state.chapter===chapters.length-1?"disabled":""}>فصل بعدی</button></div></article>`;
}
function quizHTML(comprehensive=false){
const qs=comprehensive?allQuiz():chapters[state.chapter].quiz.map((q,qi)=>({...q,chapter:state.chapter,qi,tag:chapters[state.chapter].title}));
const title=comprehensive?"آزمون جامع دوره":"آزمون فصل: "+chapters[state.chapter].title;
let score=0;if(state.quizSubmitted)qs.forEach((q,i)=>{if(Number(state.quizAnswers[i])===q.a)score++});
return `<div class="crumb"><button class="secondary" onclick="go('home')">داشبورد</button>　/　آزمون</div><section class="panel"><span class="pill">${comprehensive?"آزمون همه فصل‌ها":"آزمون فصل"}</span><h1 class="lesson-title">${title}</h1><p class="lesson-intro">برای هر پرسش یک گزینه انتخاب کنید. پس از ثبت، پاسخ صحیح و توضیح نمایش داده می‌شود.</p><div id="questions">${qs.map((q,i)=>`<div class="quiz-question"><h3>${i+1}. ${esc(q.q)}</h3>${comprehensive?'<div class="muted" style="font-size:10px;margin-bottom:7px">فصل: '+esc(q.tag)+'</div>':""}${q.o.map((op,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${state.quizAnswers[i]===String(j)?"checked":""} ${state.quizSubmitted?"disabled":""} onchange="state.quizAnswers[${i}]=this.value"><span>${esc(op)}</span></label>`).join("")}${state.quizSubmitted?`<div class="feedback ${Number(state.quizAnswers[i])===q.a?"good":"bad"}">${Number(state.quizAnswers[i])===q.a?"پاسخ درست است.":"پاسخ درست: "+esc(q.o[q.a])+"."} ${esc(q.e)}</div>`:""}</div>`).join("")}</div>
${state.quizSubmitted?`<div class="result"><h2 style="margin:0 0 5px">نتیجه: ${score} از ${qs.length}</h2><p style="margin:0;font-size:13px">درصد پاسخ درست: ${Math.round(score/qs.length*100)}٪</p><div class="progress" style="margin-top:12px;height:8px"><i style="width:${Math.round(score/qs.length*100)}%"></i></div></div>`:""}
<div class="quiz-toolbar">${state.quizSubmitted?'<button class="primary" onclick="retryQuiz()">تلاش دوباره</button>':'<button class="primary" onclick="submitQuiz('+comprehensive+')">ثبت پاسخ‌ها و مشاهده نتیجه</button>'}<button class="secondary" onclick="go('lesson',${state.chapter})">بازگشت به درس</button></div></section>`;
}
function savedHTML(){const list=chapters.map((c,i)=>({...c,i})).filter(c=>state.progress.done.includes(c.i));return `<div class="section-head"><div><h2>ادامه یادگیری</h2><p>فصل‌هایی که به‌عنوان مطالعه‌شده علامت زده‌اید.</p></div></div>${list.length?'<div class="course-grid">'+list.map(c=>`<button class="course" onclick="go('lesson',${c.i})"><div class="course-icon">✓</div><div class="course-body"><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><div class="course-foot"><span>تکمیل‌شده</span><div class="progress"><i style="width:100%"></i></div></div></div></button>`).join("")+'</div>':'<div class="panel empty">هنوز فصلی را تکمیل نکرده‌اید. از داشبورد یک فصل را باز کنید و پس از مطالعه آن را علامت بزنید.</div>'}<div class="lesson-actions"><button class="secondary" onclick="resetProgress()">پاک‌کردن پیشرفت ذخیره‌شده</button></div>`}
function wire(){document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));}
function markDone(i){if(!state.progress.done.includes(i))state.progress.done.push(i);saveProgress();render()}
function submitQuiz(comprehensive){state.quizSubmitted=true;const qs=comprehensive?allQuiz():chapters[state.chapter].quiz.map(q=>q);if(!comprehensive){const score=qs.reduce((n,q,i)=>n+(Number(state.quizAnswers[i])===q.a?1:0),0);state.progress.scores[state.chapter]=score;if(score===qs.length&&!state.progress.done.includes(state.chapter))state.progress.done.push(state.chapter);saveProgress()}render()}
function retryQuiz(){state.quizAnswers={};state.quizSubmitted=false;render()}
function resetProgress(){if(confirm("پیشرفت ذخیره‌شده این دوره روی همین دستگاه پاک شود؟")){state.progress={done:[],scores:{}};saveProgress();render()}}
$("#searchInput").addEventListener("input",e=>{state.query=e.target.value;state.view="all";render()});
$("#menuBtn").addEventListener("click",()=>$("#sidebar").classList.toggle("open"));
render();
</script>
</body>
</html>
